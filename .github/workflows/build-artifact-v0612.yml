name: Build GhostGuard artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-artifact:
    if: ${{ !contains(github.event.head_commit.message, '[artifact-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build current source artifact
        run: |
          chmod +x scripts/build_artifact_v0612.sh
          scripts/build_artifact_v0612.sh
      - name: Validate artifact contents
        run: |
          PKG=$(ls packages/ghostguard/artifacts/ghostguard_0.6.14_*.kpkg | tail -1)
          test -s "$PKG"
          mkdir -p /tmp/pkgcheck
          tar -xzf "$PKG" -C /tmp/pkgcheck
          for f in main.lua ghostguard.lua defaults.lua license_manager.lua keys/keyring.lua adaptive_bootstrap.lua simpleui_bridge.lua zenui_bridge.lua; do
            test -f "/tmp/pkgcheck/payload/dcghostguardpro.koplugin/$f"
          done
          ! grep -q 'end    return true' /tmp/pkgcheck/payload/dcghostguardpro.koplugin/main.lua
          grep -q 'SimpleUIBridge.new' /tmp/pkgcheck/payload/dcghostguardpro.koplugin/main.lua
          ! grep -q 'self.simpleui = nil' /tmp/pkgcheck/payload/dcghostguardpro.koplugin/main.lua
          grep -q 'local bridge_ok, bridge_err = self:ensureInputBridge()' /tmp/pkgcheck/payload/dcghostguardpro.koplugin/ghostguard.lua
          ! grep -q 'local protect = mode == self.config.protect_mode    local protect' /tmp/pkgcheck/payload/dcghostguardpro.koplugin/ghostguard.lua
          grep -q 'version = "0.6.14"' /tmp/pkgcheck/payload/dcghostguardpro.koplugin/defaults.lua
      - name: Sync patched runtime back to source tree
        run: |
          cp /tmp/pkgcheck/payload/dcghostguardpro.koplugin/main.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua
          cp /tmp/pkgcheck/payload/dcghostguardpro.koplugin/ghostguard.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard.lua
          cp /tmp/pkgcheck/payload/dcghostguardpro.koplugin/defaults.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
      - name: Publish source repair and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua packages/ghostguard/source/manifest.json packages/ghostguard/artifacts/ghostguard_0.6.14_*.kpkg
          git diff --cached --quiet && exit 0
          git commit -m "build: publish GhostGuard 0.6.14 artifact [artifact-bot]"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostguard-current-kpkg
          path: packages/ghostguard/artifacts/ghostguard_0.6.14_*.kpkg
          if-no-files-found: error
