name: Build GhostGuard v0.8

on:
  push:
    branches: [main, v0.8-system-service]
    paths:
      - packages/ghostguard/**
      - scripts/build_ghostguard_v080.sh
      - .github/workflows/build-artifact-v0612.yml
  pull_request:
    paths:
      - packages/ghostguard/**
      - scripts/build_ghostguard_v080.sh
      - .github/workflows/build-artifact-v0612.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v080:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Validate version and shell safety
        run: |
          set -eu
          grep -q '"version": \[0, 8, 0\]' packages/ghostguard/source/manifest.json
          grep -q 'version = "0.8.0"' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'runtime_revision = "system-service-v1"' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'GhostGuard v0.8.0' packages/ghostguard/source/payload/dcghostguardpro.koplugin/_meta.lua
          grep -q 'system_service_resume_retry_delays' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'controller fingerprint changed; fail-open' packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard.lua
          grep -q 'start on mounted_userstore' packages/ghostguard/source/system/dcpro-ghostguard.conf
          grep -q 'respawn limit 3 60' packages/ghostguard/source/system/dcpro-ghostguard.conf
          grep -q 'INPUT_GRAB=OFF' packages/ghostguard/source/system/ghostguard-service.sh
          grep -q 'EVENT_INJECTION=OFF' packages/ghostguard/source/system/ghostguard-service.sh
          ! grep -Eq 'EVIOCGRAB|/dev/uinput|uinput' packages/ghostguard/source/system/ghostguard-service.sh
          for f in packages/ghostguard/source/install.sh packages/ghostguard/source/uninstall.sh packages/ghostguard/source/launch.sh packages/ghostguard/source/system/ghostguard-service.sh packages/ghostguard/source/system/ghostguard-native-capture.sh scripts/build_ghostguard_v080.sh; do
            sh -n "$f"
          done

      - name: Compile Lua modules
        run: |
          set -eu
          P=packages/ghostguard/source/payload/dcghostguardpro.koplugin
          for f in "$P"/*.lua "$P"/keys/*.lua; do
            luajit -b "$f" /dev/null
          done

      - name: Validate profile learning compatibility
        run: |
          cat > /tmp/test_profile.lua <<'LUA'
          local root = "packages/ghostguard/source/payload/dcghostguardpro.koplugin/"
          local config = dofile(root .. "defaults.lua")
          local ProfileManager = dofile(root .. "profile_manager.lua")
          local Storage = {}; Storage.__index = Storage
          function Storage:new() return setmetatable({ files = {} }, self) end
          function Storage:readFile(p) return self.files[p] end
          function Storage:writeAtomic(p,v) self.files[p]=v; return true end
          function Storage:removeExact(p) self.files[p]=nil; return true end
          function Storage:touch(p,v) self.files[p]=v or ""; return true end
          local ordinary = function() return {x=300,y=500,learnable=false,base_score=0} end
          local ghost = function(i) return {x=12+(i%2),y=400,learnable=true,base_score=8,low_major=true,short=true,incomplete=false} end

          local pm = ProfileManager:new(config, Storage:new(), {device_id="V080BASE", model="KindleBasic4"})
          assert(pm:startCalibration())
          for i=1,40 do pm:addContact(ordinary()) end
          pm.calibration.started_wall = os.time() - 180
          assert(pm:calibrationStatus().baseline_ready)
          assert(pm:finalize())
          assert(pm:approvePending())
          assert(pm.approved.profile_kind == "BASELINE")
          assert(pm:match(300,500) == nil)

          local pm2 = ProfileManager:new(config, Storage:new(), {device_id="V080GHOST", model="KindleBasic4"})
          assert(pm2:startCalibration())
          for i=1,12 do pm2:addContact(ghost(i)) end
          pm2.calibration.started_wall = os.time() - 180
          assert(pm2:calibrationStatus().ghost_ready)
          assert(pm2:finalize())
          assert(pm2:approvePending())
          assert(pm2:match(12,400) ~= nil)
          print("PROFILE_V080_COMPAT_PASS")
          LUA
          luajit /tmp/test_profile.lua | grep -q PROFILE_V080_COMPAT_PASS

      - name: Validate system-service Lua bridge
        run: |
          cat > /tmp/test_service.lua <<'LUA'
          math.randomseed(os.time())
          local S = dofile("packages/ghostguard/source/payload/dcghostguardpro.koplugin/system_service.lua")
          local config = {data_dir="/tmp/ggv080", system_service_dir="/tmp/ggv080/service"}
          os.execute("rm -rf /tmp/ggv080")
          local s = S:new(config)
          assert(s:setDesired(true, "PROTECT_PROFILE"))
          local p = s:policy()
          assert(p.enabled == "1" and p.desired_mode == "PROTECT_PROFILE")
          assert(s:markKOReader("SUSPENDED", "PROTECT_PROFILE", "ci"))
          local f = assert(io.open("/tmp/ggv080/service/service.status", "wb"))
          f:write("DCPRO_GHOSTGUARD_SYSTEM_SERVICE_V1\nPID=123\nPOWER_STATE=active\nCONTROLLER=test-touch\nEVENT=event1\nFAIL_OPEN=YES\n")
          f:close()
          assert(s:controllerSafe())
          local text = s:statusText()
          assert(text:match("System service v0.8") and text:match("Fail%-open=YES"))
          print("SYSTEM_SERVICE_BRIDGE_PASS")
          LUA
          luajit /tmp/test_service.lua | grep -q SYSTEM_SERVICE_BRIDGE_PASS

      - name: Build integrated KPM artifact
        run: |
          chmod +x scripts/build_ghostguard_v080.sh
          scripts/build_ghostguard_v080.sh

      - name: Validate artifact contents
        run: |
          set -eu
          PKG=$(ls packages/ghostguard/artifacts/ghostguard_0.8.0_*.kpkg | tail -1)
          test -s "$PKG"
          rm -rf /tmp/ggpkg && mkdir -p /tmp/ggpkg
          tar -xzf "$PKG" -C /tmp/ggpkg
          test -f /tmp/ggpkg/payload/dcghostguardpro.koplugin/system_service.lua
          test -f /tmp/ggpkg/system/ghostguard-service.sh
          test -f /tmp/ggpkg/system/ghostguard-native-capture.sh
          test -f /tmp/ggpkg/system/dcpro-ghostguard.conf
          grep -q 'PACKAGE_VERSION=0.8.0' /tmp/ggpkg/install.sh
          grep -q 'NATIVE_INTEGRATED=1' /tmp/ggpkg/install.sh
          grep -q 'INPUT_GRAB=OFF' /tmp/ggpkg/install.sh

      - name: Upload v0.8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostguard-0.8.0-kpkg
          path: packages/ghostguard/artifacts/ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg
          if-no-files-found: error
