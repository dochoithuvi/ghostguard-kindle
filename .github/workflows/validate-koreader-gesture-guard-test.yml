name: Validate KOReader Gesture Guard Test

on:
  pull_request:
    paths:
      - DCPRO_KOReader_GestureGuard_Test_v1.1.sh
      - DCPRO_KOReader_GestureGuard_Restore_v1.1.sh
      - .github/workflows/validate-koreader-gesture-guard-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n DCPRO_KOReader_GestureGuard_Test_v1.1.sh
          sh -n DCPRO_KOReader_GestureGuard_Restore_v1.1.sh

      - name: Prepare KOReader v2026.07.1 fixture
        run: |
          sudo rm -rf /mnt/us/koreader /mnt/us/.dcpro_ghostguard
          sudo mkdir -p /mnt/us/koreader/frontend/device /mnt/us/documents
          curl -fsSL \
            https://raw.githubusercontent.com/koreader/koreader/v2026.07.1/frontend/device/gesturedetector.lua \
            -o /tmp/gesturedetector.lua
          sudo cp /tmp/gesturedetector.lua /mnt/us/koreader/frontend/device/gesturedetector.lua

      - name: Prepare Kindle-like LuaJIT validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          sudo tee /mnt/us/koreader/luajit >/dev/null <<'SH'
          #!/bin/sh
          if [ "$1" = "-b" ]; then
            echo "unknown luaJIT command or jit.* modules not installed" >&2
            exit 1
          fi
          exec /usr/bin/luajit "$@"
          SH
          sudo chmod +x /mnt/us/koreader/luajit
          ! sudo /mnt/us/koreader/luajit -b /tmp/gesturedetector.lua /tmp/out.luac
          sudo /mnt/us/koreader/luajit -e 'assert(loadfile([[\/tmp\/gesturedetector.lua]]))'

      - name: Apply guard to upstream fixture
        run: |
          sudo sh DCPRO_KOReader_GestureGuard_Test_v1.1.sh
          TARGET=/mnt/us/koreader/frontend/device/gesturedetector.lua
          sudo grep -q 'DCPRO_KOREADER_GESTURE_NIL_GUARD_V1' "$TARGET"
          sudo grep -q 'DCPRO Gesture nil-guard dropped incomplete two-finger tap frame' "$TARGET"
          sudo grep -q 'DCPRO Gesture nil-guard dropped incomplete path frame' "$TARGET"
          sudo grep -q 'sane_touch_frame = normalizeTouchCoordinates' "$TARGET"
          sudo test -f "$TARGET.dcpro-pre-gesture-guard-v1.bak"
          sudo cmp -s /tmp/gesturedetector.lua "$TARGET.dcpro-pre-gesture-guard-v1.bak"
          sudo grep -q 'LuaJIT loadfile syntax validation: PASS' /mnt/us/documents/KOReader_GestureGuard_Test.log

      - name: Verify idempotence
        run: |
          TARGET=/mnt/us/koreader/frontend/device/gesturedetector.lua
          sudo sha256sum "$TARGET" | awk '{print $1}' > /tmp/hash.before
          sudo sh DCPRO_KOReader_GestureGuard_Test_v1.1.sh
          sudo sha256sum "$TARGET" | awk '{print $1}' > /tmp/hash.after
          cmp -s /tmp/hash.before /tmp/hash.after

      - name: Verify diagnostic log
        run: |
          sudo grep -q 'SUCCESS: gesture nil-guard v1.1 installed' /mnt/us/documents/KOReader_GestureGuard_Test.log
          sudo grep -q 'Already patched' /mnt/us/documents/KOReader_GestureGuard_Test.log

      - name: Verify rollback restores upstream bytes
        run: |
          sudo sh DCPRO_KOReader_GestureGuard_Restore_v1.1.sh
          TARGET=/mnt/us/koreader/frontend/device/gesturedetector.lua
          sudo cmp -s /tmp/gesturedetector.lua "$TARGET"
          ! sudo grep -q 'DCPRO_KOREADER_GESTURE_NIL_GUARD_V1' "$TARGET"
          sudo grep -q 'SUCCESS: restored' /mnt/us/documents/KOReader_GestureGuard_Restore.log
