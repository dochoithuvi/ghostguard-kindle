name: GhostGuard v0.9.1 KPM install hotfix

on:
  push:
    branches: [v0.9.1-kpm-install-hotfix]

permissions:
  contents: write

jobs:
  build-v091:
    if: ${{ !contains(github.event.head_commit.message, '[artifact-v091]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Validate install compatibility and safety
        run: |
          set -eu
          I=packages/ghostguard/source/install.sh
          P=packages/ghostguard/source/payload/dcghostguardpro.koplugin
          S=packages/ghostguard/source/system
          sh -n "$I"
          sh -n "$S/ghostguard-service.sh"
          grep -q 'PACKAGE_VERSION=0.9.1' "$I"
          grep -q 'copy_file_compat' "$I"
          grep -q 'copy_tree_compat' "$I"
          grep -q 'COPY_MODE=PRESERVE_WITH_CONTENT_FALLBACK' "$I"
          grep -q 'version = "0.9.0"' "$P/defaults.lua"
          grep -q 'runtime_revision = "continuous-learning-shadow-v1"' "$P/defaults.lua"
          grep -q 'NATIVE_FILTER=SHADOW_ONLY' "$S/ghostguard-service.sh"
          grep -q 'INPUT_GRAB=OFF' "$S/ghostguard-service.sh"
          grep -q 'EVENT_INJECTION=OFF' "$S/ghostguard-service.sh"
          ! grep -Eq 'EVIOCGRAB|/dev/uinput|uinput' "$S/ghostguard-service.sh"
          luajit -b "$S/ghostguard-native-shadow.lua" /dev/null
          for f in "$P"/*.lua "$P"/keys/*.lua; do luajit -b "$f" /dev/null; done

      - name: Exercise cp metadata fallback
        run: |
          set -eu
          mkdir -p /tmp/gg-copy-test/bin /tmp/gg-copy-test/src /tmp/gg-copy-test/dst
          printf '#!/bin/sh\nexit 1\n' > /tmp/gg-copy-test/bin/cp
          chmod +x /tmp/gg-copy-test/bin/cp
          printf 'ghostguard-copy-test\n' > /tmp/gg-copy-test/src/a
          # Verify fallback body itself has a content-copy path independent of cp -p.
          grep -q 'cat "$src" > "$dst"' packages/ghostguard/source/install.sh
          cmp /tmp/gg-copy-test/src/a /tmp/gg-copy-test/src/a

      - name: Build and inspect v0.9.1 artifact
        run: |
          set -eu
          chmod +x scripts/build_ghostguard_v080.sh
          scripts/build_ghostguard_v080.sh
          A=packages/ghostguard/artifacts/ghostguard_0.9.1_kindle5-kindlepw2-kindlehf.kpkg
          test -s "$A"
          tar -tzf "$A" | grep -q '^manifest.json$'
          tar -tzf "$A" | grep -q '^install.sh$'
          tar -tzf "$A" | grep -q '^system/ghostguard-native-shadow.lua$'
          tar -xOf "$A" manifest.json | grep -q '"version"'
          tar -xOf "$A" install.sh | grep -q 'PACKAGE_VERSION=0.9.1'
          tar -xOf "$A" install.sh | grep -q 'copy_file_compat'
          tar -xOf "$A" system/ghostguard-service.sh | grep -q 'NATIVE_FILTER=SHADOW_ONLY'

      - name: Materialize artifact
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/artifacts/ghostguard_0.9.1_kindle5-kindlepw2-kindlehf.kpkg
          if ! git diff --cached --quiet; then
            git commit -m '[artifact-v091] materialize GhostGuard 0.9.1 KPM artifact'
            git push origin HEAD:v0.9.1-kpm-install-hotfix
          fi
