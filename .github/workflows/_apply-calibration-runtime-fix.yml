name: Apply calibration runtime fix
on:
  push:
    branches: [agent/fix-calibration-runtime-flow]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[calibration-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-calibration-runtime-flow
      - name: Apply calibration fix
        run: python3 scripts/_apply_calibration_runtime_fix.py
      - name: Syntax checks
        run: |
          sh -n DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          sh -n scripts/build_artifact_v0612.sh
          grep -q 'runtime_revision = "calibration-flow-v2"' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'CALIBRATION_INPUT:' packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard.lua
          grep -q '_resume_calibration_after_suspend' packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DCPRO_GhostGuard_OneClick_Installer_v12.1.sh scripts/build_artifact_v0612.sh packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/profile_manager.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard.lua packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua
          git diff --cached --quiet && exit 0
          git commit -m "fix: make calibration observe real input and resume safely [calibration-fix-bot]"
          git push origin HEAD:agent/fix-calibration-runtime-flow
