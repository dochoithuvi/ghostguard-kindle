name: Apply KPM 0.1 manifest compatibility

on:
  push:
    branches:
      - agent/fix-kpm01-manifest-compat

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[kpm01-compat-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-kpm01-manifest-compat
          fetch-depth: 0
      - name: Apply compatibility patch
        run: |
          python3 scripts/_tmp_fix_kpm01_manifest.py
          sh -n DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          python3 - <<'PY'
          import json
          for name in ('manifest.json','manifest.mirror.json'):
              d=json.load(open(name,encoding='utf-8'))
              assert d['manifest_version'] == 1
              assert 'ghostguard' in d['packages']
          PY
          grep -q 'manifest.v2.json remains available for newer KPM' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'main/manifest.json' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'KindleModding/repo@main/manifest.json' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          git diff --check
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DCPRO_GhostGuard_OneClick_Installer_v12.1.sh manifest.json manifest.mirror.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: support KPM 0.1 manifest v1 [kpm01-compat-bot]"
          git push origin HEAD:agent/fix-kpm01-manifest-compat
