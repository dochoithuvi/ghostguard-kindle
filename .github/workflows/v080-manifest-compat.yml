name: GhostGuard v0.8 manifest compatibility

on:
  push:
    branches: [main, v0.8-system-service]
    paths:
      - manifest.v2.json
      - manifest.json
      - manifest.mirror.json
      - DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
      - packages/ghostguard/source/manifest.json
      - packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
      - packages/ghostguard/artifacts/ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg
      - .github/workflows/v080-manifest-compat.yml
  pull_request:
    paths:
      - manifest.v2.json
      - manifest.json
      - manifest.mirror.json
      - DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
      - packages/ghostguard/source/manifest.json
      - packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
      - packages/ghostguard/artifacts/ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg
      - .github/workflows/v080-manifest-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse manifests
        run: |
          set -eu
          python3 -m json.tool manifest.v2.json >/dev/null
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool manifest.mirror.json >/dev/null
          python3 -m json.tool packages/ghostguard/source/manifest.json >/dev/null

      - name: Validate GhostGuard v0.8 production selection
        run: |
          set -eu
          python3 - <<'PY'
          import json
          for name in ("manifest.v2.json", "manifest.json", "manifest.mirror.json"):
              with open(name, encoding="utf-8") as f:
                  data = json.load(f)
              gg = data["packages"]["ghostguard"]
              artifacts = gg["artifacts"]
              assert artifacts, name
              assert artifacts[0]["version"] == [0, 8, 0], (name, artifacts[0])
              assert artifacts[0]["url"].endswith("ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg")
          with open("packages/ghostguard/source/manifest.json", encoding="utf-8") as f:
              source = json.load(f)
          assert source["version"] == [0, 8, 0]
          PY
          test -s packages/ghostguard/artifacts/ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg

      - name: Validate OneClick v12.1 backward compatibility
        run: |
          set -eu
          # OneClick v12.1 intentionally remains unchanged. It validates the old
          # artifact/version by string and then asks KPM for package `ghostguard`.
          # v0.8 keeps the old artifact in v2 manifests and comment anchors in
          # defaults.lua so the legacy bootstrap accepts the upgraded runtime.
          grep -q '^GG_EXPECT=0.6.17$' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q '^GG_RUNTIME_REVISION=calibration-flow-v2$' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q '^GG_ARTIFACT_NAME=ghostguard_0.6.17_kindle5-kindlepw2-kindlehf.kpkg$' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q '^-- version = "0.6.17"$' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q '^-- runtime_revision = "calibration-flow-v2"$' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          for m in manifest.v2.json manifest.mirror.json; do
            compact=$(tr -d '[:space:]' < "$m")
            printf '%s' "$compact" | grep -Fq 'ghostguard_0.6.17_kindle5-kindlepw2-kindlehf.kpkg'
            printf '%s' "$compact" | grep -Fq '"version":[0,6,17]'
            printf '%s' "$compact" | grep -Fq 'ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg'
            printf '%s' "$compact" | grep -Fq '"version":[0,8,0]'
          done

      - name: Validate system-service safety contract is packaged
        run: |
          set -eu
          rm -rf /tmp/gg080 && mkdir -p /tmp/gg080
          tar -xzf packages/ghostguard/artifacts/ghostguard_0.8.0_kindle5-kindlepw2-kindlehf.kpkg -C /tmp/gg080
          grep -q 'INPUT_GRAB=OFF' /tmp/gg080/system/ghostguard-service.sh
          grep -q 'EVENT_INJECTION=OFF' /tmp/gg080/system/ghostguard-service.sh
          ! grep -Eq 'EVIOCGRAB|/dev/uinput|uinput' /tmp/gg080/system/ghostguard-service.sh
          grep -q 'respawn limit 3 60' /tmp/gg080/system/dcpro-ghostguard.conf
