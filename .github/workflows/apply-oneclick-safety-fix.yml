name: Apply OneClick safety fix

on:
  push:
    branches:
      - agent/fix-oneclick-koreader-safety-guard

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[oneclick-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-oneclick-koreader-safety-guard
          fetch-depth: 0
      - name: Apply transformer
        run: python3 scripts/_apply_oneclick_safety_fix.py
      - name: Validate shell and expected fix
        run: |
          sh -n DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'copy_backup_portable' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'log_koreader_guard_context' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'metadata-preserving KOReader backup failed' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'copy_backup_portable "$TARGET" "$BACKUP"' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
      - name: Commit transformed files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DCPRO_GhostGuard_OneClick_Installer_v12.1.sh README.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make OneClick KOReader guard backup portable [oneclick-fix-bot]'
          git push origin HEAD:agent/fix-oneclick-koreader-safety-guard
