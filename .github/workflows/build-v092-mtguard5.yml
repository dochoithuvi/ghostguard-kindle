name: Publish exact MTGuard5 golden build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v092-mtguard5.yml

permissions:
  contents: write

jobs:
  publish-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact field-tested MTGuard5 bytes
        run: |
          set -eu
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.1_kindle5-kindlepw2-kindlehf.kpkg'
          WANT='b399a10165812f529548c9e193e1b75629dbbc4c758fbab15cc41b0c241ff0d0'
          COVER_WANT='0cbfa7a143a52eb6c23cf75afa4b1d3395cbbeed8f0a83bbb315ccc3b9edad8e'

          test -s "$SRC"
          got="$(sha256sum "$SRC" | awk '{print $1}')"
          echo "MTGuard5 source SHA-256: $got"
          test "$got" = "$WANT"

          rm -rf /tmp/mtguard5 && mkdir -p /tmp/mtguard5
          tar -xzf "$SRC" -C /tmp/mtguard5

          grep -R -F '0.9.1-local-mtguard5' /tmp/mtguard5 >/dev/null
          grep -R -F 'mtguard1-adaptive-v3-approved-cover-nocloud' /tmp/mtguard5 >/dev/null

          COVER=''
          for f in \
            /tmp/mtguard5/assets/ghostguard_library_600x960.jpg \
            /tmp/mtguard5/payload/dcghostguardpro.koplugin/assets/ghostguard_library_600x960.jpg; do
            if [ -s "$f" ]; then COVER="$f"; break; fi
          done
          test -n "$COVER"
          cover_got="$(sha256sum "$COVER" | awk '{print $1}')"
          echo "Approved cover SHA-256: $cover_got"
          test "$cover_got" = "$COVER_WANT"

          test -f /tmp/mtguard5/install.sh
          sh -n /tmp/mtguard5/install.sh

      - name: Publish byte-identical golden artifact
        run: |
          set -eu
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.1_kindle5-kindlepw2-kindlehf.kpkg'
          DST='packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg'
          WANT='b399a10165812f529548c9e193e1b75629dbbc4c758fbab15cc41b0c241ff0d0'
          cp "$SRC" "$DST"
          cmp "$SRC" "$DST"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$WANT"

      - name: Switch public OneClick to golden artifact
        run: |
          set -eu
          F='DCPRO_GhostGuard_OneClick_Installer_v14.sh'
          GOLDEN='ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg'
          WANT='b399a10165812f529548c9e193e1b75629dbbc4c758fbab15cc41b0c241ff0d0'

          python3 - <<'PY'
          from pathlib import Path
          p = Path('DCPRO_GhostGuard_OneClick_Installer_v14.sh')
          s = p.read_text()
          s = s.replace('# Ensure KOReader + SimpleUI via the dedicated v14 bootstrap, then install GhostGuard 0.9.2.',
                        '# Ensure KOReader + SimpleUI, then install the byte-identical field-tested MTGuard5 golden build.')
          s = s.replace('GG_NAME="ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg"',
                        'GG_NAME="ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg"')
          import re
          s = re.sub(r'GG_SHA256="[0-9a-f]{64}"',
                     'GG_SHA256="b399a10165812f529548c9e193e1b75629dbbc4c758fbab15cc41b0c241ff0d0"', s)
          s = s.replace('KOReader + SimpleUI + GhostGuard 0.9.2', 'KOReader + SimpleUI + MTGuard5 GOLDEN')
          s = s.replace('Tai GhostGuard 0.9.2...', 'Tai MTGuard5 GOLDEN...')
          s = s.replace('Downloading GhostGuard 0.9.2 package.', 'Downloading byte-identical MTGuard5 golden package.')
          s = s.replace('khong tai duoc GhostGuard 0.9.2', 'khong tai duoc MTGuard5 golden')
          s = s.replace('GhostGuard 0.9.2 install failed', 'MTGuard5 golden install failed')
          s = s.replace('GhostGuard 0.9.2 install complete.', 'MTGuard5 golden install complete.')
          s = s.replace('GHOSTGUARD_VERSION=0.9.2', 'GHOSTGUARD_VERSION=0.9.1-local-mtguard5')
          s = s.replace('RUNTIME=MTGUARD5_ADAPTIVE_V3', 'RUNTIME=mtguard1-adaptive-v3-approved-cover-nocloud')
          s = s.replace('THANH CONG! GhostGuard 0.9.2 da cai dat', 'THANH CONG! MTGuard5 GOLDEN da cai dat')
          s = s.replace('GhostGuard 0.9.2 installed successfully.', 'MTGuard5 golden installed successfully.')
          p.write_text(s)
          PY

          grep -F "GG_NAME=\"$GOLDEN\"" "$F"
          grep -F "GG_SHA256=\"$WANT\"" "$F"
          grep -F 'GHOSTGUARD_VERSION=0.9.1-local-mtguard5' "$F"
          grep -F 'RUNTIME=mtguard1-adaptive-v3-approved-cover-nocloud' "$F"
          sh -n "$F"

      - name: Validate public URLs and fresh-install contract
        run: |
          set -eu
          F='DCPRO_GhostGuard_OneClick_Installer_v14.sh'
          grep -F 'bootstrap/koreader-simpleui-v14.sh' "$F"
          grep -F 'ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg' "$F"
          grep -F 'b399a10165812f529548c9e193e1b75629dbbc4c758fbab15cc41b0c241ff0d0' "$F"
          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$F"
          grep -F 'INPUT_GRAB=OFF' "$F"
          grep -F 'EVENT_INJECTION=OFF' "$F"
          ! grep -F 'ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg' "$F"

      - name: Commit golden artifact and OneClick switch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg DCPRO_GhostGuard_OneClick_Installer_v14.sh
          if ! git diff --cached --quiet; then
            git commit -m 'release: switch OneClick to exact MTGuard5 golden artifact'
            git push origin HEAD:main
          fi
