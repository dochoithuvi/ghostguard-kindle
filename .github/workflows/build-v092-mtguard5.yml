name: Publish exact MTGuard5 golden build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v092-mtguard5.yml
      - packages/ghostguard/source/**
      - scripts/build_ghostguard_v092.sh
      - scripts/test_goodix_crashshield.lua

permissions:
  contents: write

jobs:
  publish-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1 test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1

      - name: Validate MTGuard5 golden runtime identity and safety contracts
        run: |
          set -eu
          S='packages/ghostguard/source'
          P="$S/payload/dcghostguardpro.koplugin"

          grep -F 'version = "0.9.1-local-mtguard5"' "$P/defaults.lua"
          grep -F 'runtime_revision = "mtguard1-adaptive-v3-approved-cover-nocloud"' "$P/defaults.lua"
          grep -F 'function GhostGuard:guardMalformedMtFrame' "$P/ghostguard_core.lua"
          grep -F 'function Adaptive:fastTrackEligible' "$P/adaptive_bootstrap.lua"
          test -f "$P/LOCAL_MT_GUARD5_README.txt"
          test -f "$P/goodix_crashshield.lua"
          test ! -e "$P/cloud_manager.lua"
          test ! -e "$P/zenui_bridge.lua"
          test ! -e "$P/PUBLIC_V4_README.txt"

          lua5.1 scripts/test_goodix_crashshield.lua "$P/goodix_crashshield.lua"
          grep -F 'local CrashShield = dofile(plugin_dir .. "goodix_crashshield.lua")' "$P/ghostguard.lua"
          grep -F 'MT_GUARD_DROP_CORRUPT_CONTACT' "$P/goodix_crashshield.lua"
          grep -F 'PASS_THROUGH_SAFE' "$P/goodix_crashshield.lua"
          grep -F 'self.config.protect_wrapper_all_modes = true' "$P/goodix_crashshield.lua"
          ! grep -F 'EVIOCGRAB' "$P/goodix_crashshield.lua"
          ! grep -F '/dev/uinput' "$P/goodix_crashshield.lua"

          grep -F 'adaptive_checkpoint_samples = 4' "$P/defaults.lua"
          grep -F 'adaptive_checkpoint_seconds = 30' "$P/defaults.lua"
          grep -F 'adaptive_promotion_min_cluster = 4' "$P/defaults.lua"
          grep -F 'adaptive_promotion_min_age_seconds = 15' "$P/defaults.lua"
          grep -F 'adaptive_external_report_seconds = 5' "$P/defaults.lua"
          grep -F 'adaptive_min_base_score = 7' "$P/defaults.lua"
          grep -F 'protect_drop_score = 8' "$P/defaults.lua"

          grep -F 'GOODIX_CRASH_SHIELD=1' "$S/install.sh"
          grep -F 'TOUCH_SHIELD_MODE=PASS_THROUGH_SAFE' "$S/install.sh"
          grep -F 'LIBRARY_ENTRY=KO_READER_ONLY' "$S/install.sh"
          grep -F 'GHOSTGUARD_LIBRARY_LAUNCHER=REMOVED' "$S/install.sh"
          grep -F 'GHOSTGUARD_LIBRARY_ICON=REMOVED' "$S/install.sh"
          grep -F 'rm -f "$LEGACY_LAUNCHER"' "$S/install.sh"
          ! grep -F 'copy_file_compat "scriptlets/DCPRO_GhostGuard.sh"' "$S/install.sh"
          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$S/install.sh"
          grep -F 'INPUT_GRAB=OFF' "$S/install.sh"
          grep -F 'EVENT_INJECTION=OFF' "$S/install.sh"

          sh -n "$S/install.sh"
          sh -n "$S/uninstall.sh"
          sh -n "$S/launch.sh"
          sh -n scripts/build_ghostguard_v092.sh

      - name: Build deterministic golden artifact twice
        id: build
        run: |
          set -eu
          chmod +x scripts/build_ghostguard_v092.sh
          scripts/build_ghostguard_v092.sh
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg'
          first="$(sha256sum "$SRC" | awk '{print $1}')"
          cp "$SRC" /tmp/mtguard5-first.kpkg
          scripts/build_ghostguard_v092.sh
          second="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$first" = "$second"
          cmp /tmp/mtguard5-first.kpkg "$SRC"
          test "${#first}" = 64
          echo "artifact_sha=$first" >> "$GITHUB_OUTPUT"
          echo "Golden artifact SHA-256: $first"

      - name: Validate packaged runtime and KOReader-only install contract
        run: |
          set -eu
          S='packages/ghostguard/source'
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg'
          ART="$S/assets/ghostguard_library_600x960.jpg"
          rm -rf /tmp/mtguard5 && mkdir -p /tmp/mtguard5
          tar -xzf "$SRC" -C /tmp/mtguard5
          P=/tmp/mtguard5/payload/dcghostguardpro.koplugin

          grep -F 'version = "0.9.1-local-mtguard5"' "$P/defaults.lua"
          grep -F 'runtime_revision = "mtguard1-adaptive-v3-approved-cover-nocloud"' "$P/defaults.lua"
          grep -F 'adaptive_checkpoint_samples = 4' "$P/defaults.lua"
          grep -F 'adaptive_checkpoint_seconds = 30' "$P/defaults.lua"
          grep -F 'adaptive_promotion_min_cluster = 4' "$P/defaults.lua"
          grep -F 'adaptive_external_report_seconds = 5' "$P/defaults.lua"
          test -f "$P/goodix_crashshield.lua"
          grep -F 'goodix_crashshield.lua' "$P/ghostguard.lua"
          grep -F 'MT_GUARD_DROP_CORRUPT_CONTACT' "$P/goodix_crashshield.lua"
          grep -F 'PASS_THROUGH_SAFE' "$P/goodix_crashshield.lua"
          test ! -e "$P/cloud_manager.lua"
          test ! -e "$P/zenui_bridge.lua"
          sh -n /tmp/mtguard5/install.sh
          grep -F 'GOODIX_CRASH_SHIELD=1' /tmp/mtguard5/install.sh
          grep -F 'TOUCH_SHIELD_MODE=PASS_THROUGH_SAFE' /tmp/mtguard5/install.sh
          grep -F 'LIBRARY_ENTRY=KO_READER_ONLY' /tmp/mtguard5/install.sh
          grep -F 'GHOSTGUARD_LIBRARY_ICON=REMOVED' /tmp/mtguard5/install.sh
          ! grep -F 'LIBRARY_ICON_MODE=EMBEDDED_PNG_FORCE_REINDEX' /tmp/mtguard5/install.sh
          ! grep -F 'copy_file_compat "scriptlets/DCPRO_GhostGuard.sh"' /tmp/mtguard5/install.sh

          # Keep artwork bytes deterministic for backward-compatible package
          # structure, but the installer no longer exposes it as a Library icon.
          test -s "$ART"
          test -s /tmp/mtguard5/assets/ghostguard_library_600x960.jpg
          test -s "$P/assets/ghostguard_library_600x960.jpg"
          cmp "$ART" /tmp/mtguard5/assets/ghostguard_library_600x960.jpg
          cmp "$ART" "$P/assets/ghostguard_library_600x960.jpg"
          art_sha="$(sha256sum "$ART" | awk '{print $1}')"
          echo "Unused compatibility artwork SHA-256: $art_sha"

      - name: Publish golden name and pin OneClick
        run: |
          set -eu
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg'
          DST='packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg'
          F='DCPRO_GhostGuard_OneClick_Installer_v14.sh'
          SHA='${{ steps.build.outputs.artifact_sha }}'

          cp "$SRC" "$DST"
          cmp "$SRC" "$DST"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$SHA"

          python3 - "$SHA" <<'PY'
          from pathlib import Path
          import re, sys
          sha = sys.argv[1]
          p = Path('DCPRO_GhostGuard_OneClick_Installer_v14.sh')
          s = p.read_text()
          s = re.sub(r'GG_NAME="[^"]+\.kpkg"',
                     'GG_NAME="ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg"', s, count=1)
          s = re.sub(r'GG_SHA256="[0-9a-f]{64}"', f'GG_SHA256="{sha}"', s, count=1)
          p.write_text(s)
          PY

          grep -F 'GG_NAME="ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg"' "$F"
          grep -F "GG_SHA256=\"$SHA\"" "$F"
          grep -F 'GHOSTGUARD_VERSION=0.9.1-local-mtguard5' "$F"
          grep -F 'RUNTIME=mtguard1-adaptive-v3-approved-cover-nocloud' "$F"
          grep -F 'KO_READER_BOOT_AUTOSTART=0' "$F"
          grep -F 'KO_READER_LIBRARY_ENTRY=PRIMARY' "$F"
          grep -F 'GHOSTGUARD_LIBRARY_ICON=REMOVED' "$F"
          grep -F 'ADAPTIVE_CHECKPOINT_SAMPLES=4' "$F"
          grep -F 'ADAPTIVE_CHECKPOINT_SECONDS=30' "$F"
          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$F"
          grep -F 'INPUT_GRAB=OFF' "$F"
          grep -F 'EVENT_INJECTION=OFF' "$F"
          sh -n "$F"

      - name: Commit golden artifact and OneClick switch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg \
                  packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg \
                  DCPRO_GhostGuard_OneClick_Installer_v14.sh
          if ! git diff --cached --quiet; then
            git commit -m 'release: publish KOReader-only faster-learning MTGuard5 golden build'
            git push origin HEAD:main
          fi
