name: Publish exact MTGuard5 golden build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v092-mtguard5.yml

permissions:
  contents: write

jobs:
  publish-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate MTGuard5 golden runtime identity
        run: |
          set -eu
          S='packages/ghostguard/source'
          P="$S/payload/dcghostguardpro.koplugin"

          grep -F 'version = "0.9.1-local-mtguard5"' "$P/defaults.lua"
          grep -F 'runtime_revision = "mtguard1-adaptive-v3-approved-cover-nocloud"' "$P/defaults.lua"
          grep -F 'function GhostGuard:guardMalformedMtFrame' "$P/ghostguard_core.lua"
          grep -F 'function Adaptive:fastTrackEligible' "$P/adaptive_bootstrap.lua"
          test -f "$P/LOCAL_MT_GUARD5_README.txt"
          test ! -e "$P/cloud_manager.lua"
          test ! -e "$P/zenui_bridge.lua"
          test ! -e "$P/PUBLIC_V4_README.txt"

          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$S/install.sh"
          grep -F 'INPUT_GRAB=OFF' "$S/install.sh"
          grep -F 'EVENT_INJECTION=OFF' "$S/install.sh"

          sh -n "$S/install.sh"
          sh -n "$S/uninstall.sh"
          sh -n "$S/launch.sh"
          sh -n scripts/build_ghostguard_v092.sh

      - name: Build deterministic golden artifact twice
        id: build
        run: |
          set -eu
          chmod +x scripts/build_ghostguard_v092.sh
          scripts/build_ghostguard_v092.sh
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg'
          first="$(sha256sum "$SRC" | awk '{print $1}')"
          cp "$SRC" /tmp/mtguard5-first.kpkg
          scripts/build_ghostguard_v092.sh
          second="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$first" = "$second"
          cmp /tmp/mtguard5-first.kpkg "$SRC"
          test "${#first}" = 64
          echo "artifact_sha=$first" >> "$GITHUB_OUTPUT"
          echo "Golden artifact SHA-256: $first"

      - name: Validate packaged runtime, installer and approved icon
        run: |
          set -eu
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg'
          COVER_WANT='0cbfa7a143a52eb6c23cf75afa4b1d3395cbbeed8f0a83bbb315ccc3b9edad8e'
          rm -rf /tmp/mtguard5 && mkdir -p /tmp/mtguard5
          tar -xzf "$SRC" -C /tmp/mtguard5

          grep -F 'version = "0.9.1-local-mtguard5"' /tmp/mtguard5/payload/dcghostguardpro.koplugin/defaults.lua
          grep -F 'runtime_revision = "mtguard1-adaptive-v3-approved-cover-nocloud"' /tmp/mtguard5/payload/dcghostguardpro.koplugin/defaults.lua
          test ! -e /tmp/mtguard5/payload/dcghostguardpro.koplugin/cloud_manager.lua
          test ! -e /tmp/mtguard5/payload/dcghostguardpro.koplugin/zenui_bridge.lua
          sh -n /tmp/mtguard5/install.sh

          test -s /tmp/mtguard5/assets/ghostguard_library_600x960.jpg
          test -s /tmp/mtguard5/payload/dcghostguardpro.koplugin/assets/ghostguard_library_600x960.jpg
          test "$(sha256sum /tmp/mtguard5/assets/ghostguard_library_600x960.jpg | awk '{print $1}')" = "$COVER_WANT"
          test "$(sha256sum /tmp/mtguard5/payload/dcghostguardpro.koplugin/assets/ghostguard_library_600x960.jpg | awk '{print $1}')" = "$COVER_WANT"
          cmp /tmp/mtguard5/assets/ghostguard_library_600x960.jpg /tmp/mtguard5/payload/dcghostguardpro.koplugin/assets/ghostguard_library_600x960.jpg

      - name: Publish golden name and pin OneClick
        run: |
          set -eu
          SRC='packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg'
          DST='packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg'
          F='DCPRO_GhostGuard_OneClick_Installer_v14.sh'
          SHA='${{ steps.build.outputs.artifact_sha }}'

          cp "$SRC" "$DST"
          cmp "$SRC" "$DST"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$SHA"

          python3 - "$SHA" <<'PY'
          from pathlib import Path
          import re, sys
          sha = sys.argv[1]
          p = Path('DCPRO_GhostGuard_OneClick_Installer_v14.sh')
          s = p.read_text()
          s = s.replace('# Ensure KOReader + SimpleUI via the dedicated v14 bootstrap, then install GhostGuard 0.9.2.',
                        '# Ensure KOReader + SimpleUI, then install the MTGuard5 golden runtime.')
          s = re.sub(r'GG_NAME="[^"]+\.kpkg"',
                     'GG_NAME="ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg"', s, count=1)
          s = re.sub(r'GG_SHA256="[0-9a-f]{64}"', f'GG_SHA256="{sha}"', s, count=1)
          s = s.replace('KOReader + SimpleUI + GhostGuard 0.9.2', 'KOReader + SimpleUI + MTGuard5 GOLDEN')
          s = s.replace('Tai GhostGuard 0.9.2...', 'Tai MTGuard5 GOLDEN...')
          s = s.replace('Downloading GhostGuard 0.9.2 package.', 'Downloading MTGuard5 golden package.')
          s = s.replace('khong tai duoc GhostGuard 0.9.2', 'khong tai duoc MTGuard5 golden')
          s = s.replace('GhostGuard 0.9.2 install failed', 'MTGuard5 golden install failed')
          s = s.replace('GhostGuard 0.9.2 install complete.', 'MTGuard5 golden install complete.')
          s = s.replace('GHOSTGUARD_VERSION=0.9.2', 'GHOSTGUARD_VERSION=0.9.1-local-mtguard5')
          s = s.replace('RUNTIME=MTGUARD5_ADAPTIVE_V3', 'RUNTIME=mtguard1-adaptive-v3-approved-cover-nocloud')
          s = s.replace('THANH CONG! GhostGuard 0.9.2 da cai dat', 'THANH CONG! MTGuard5 GOLDEN da cai dat')
          s = s.replace('GhostGuard 0.9.2 installed successfully.', 'MTGuard5 golden installed successfully.')
          p.write_text(s)
          PY

          grep -F 'GG_NAME="ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg"' "$F"
          grep -F "GG_SHA256=\"$SHA\"" "$F"
          grep -F 'GHOSTGUARD_VERSION=0.9.1-local-mtguard5' "$F"
          grep -F 'RUNTIME=mtguard1-adaptive-v3-approved-cover-nocloud' "$F"
          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$F"
          grep -F 'INPUT_GRAB=OFF' "$F"
          grep -F 'EVENT_INJECTION=OFF' "$F"
          sh -n "$F"

      - name: Commit golden artifact and OneClick switch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg \
                  packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg \
                  DCPRO_GhostGuard_OneClick_Installer_v14.sh
          if ! git diff --cached --quiet; then
            git commit -m 'release: switch OneClick to MTGuard5 golden build'
            git push origin HEAD:main
          fi
