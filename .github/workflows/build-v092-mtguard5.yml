name: Validate GhostGuard 0.9.2 MTGuard5
on:
  push:
    branches: [v0.9.2-mtguard5-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact MTGuard5 release source
        run: |
          set -eu
          S=packages/ghostguard/source
          P="$S/payload/dcghostguardpro.koplugin"
          BUNDLE_WANT=883134244eaccedd17cc7d3eed5fd239852cc1c594fb0f03e8abd368620b76f6

          exact_source_ready() {
            test "$(sha256sum "$S/install.sh" | awk '{print $1}')" = "e8f19294553ccb732eede3703d792a1e773dc0e23fce163c3fef5d62ccbb08da" &&
            test "$(sha256sum "$S/manifest.json" | awk '{print $1}')" = "b9372e8637ae0788e92dd4387a01471995db1d9f4094350309a891881bc7f0f2" &&
            test "$(sha256sum "$P/adaptive_bootstrap.lua" | awk '{print $1}')" = "54245e36fca08055f314c23162772659b44a60850a951285c584fd3ee90813da" &&
            test "$(sha256sum "$P/defaults.lua" | awk '{print $1}')" = "134af061c0abf4b5a94602ea241af724244cc717fee4d0e84d8513be9e843db8" &&
            test "$(sha256sum "$P/ghostguard_core.lua" | awk '{print $1}')" = "01eb6d4b977aeff25e50e691a955e7b38b601a74e2381e409ac58630be118fe9" &&
            test "$(sha256sum "$P/main.lua" | awk '{print $1}')" = "d2d8e351ba8fe06a0cc01c3bd50fdb88cbc2175ba0a369c48c2ed622f00bbe8e" &&
            test "$(sha256sum "$P/simpleui_bridge.lua" | awk '{print $1}')" = "f4d62ce81920960ed5be6529f05334db728d56f53f9ad88d05ea88129cc31a45" &&
            test "$(sha256sum "$P/storage.lua" | awk '{print $1}')" = "9e5fb761755b03f7e9b75cb72413c37d3a3a9c17fb6b983bc54794d3e597e586"
          }

          if exact_source_ready; then
            echo "Exact MTGuard5 + Adaptive V3 source already materialized."
          else
            test -d .release-exact
            cat \
              .release-exact/runtime_bundle.b64.00 \
              .release-exact/runtime_bundle.b64.01a \
              .release-exact/runtime_bundle.b64.01b \
              .release-exact/runtime_bundle.b64.01c \
              .release-exact/runtime_bundle.b64.01d \
              .release-exact/runtime_bundle.b64.02 \
              .release-exact/runtime_bundle.b64.03a \
              .release-exact/runtime_bundle.b64.03b \
              .release-exact/runtime_bundle.b64.03c \
              | tr -d '\r\n' | base64 -d > /tmp/gg092-exact.tar.gz

            test "$(sha256sum /tmp/gg092-exact.tar.gz | awk '{print $1}')" = "$BUNDLE_WANT"
            gzip -t /tmp/gg092-exact.tar.gz
            tar -tzf /tmp/gg092-exact.tar.gz | grep -q '^packages/ghostguard/source/'
            tar -xzf /tmp/gg092-exact.tar.gz -C .
            exact_source_ready
          fi

          # Public 0.9.2 remains local-only; legacy Cloud/ZenUI modules must not ship.
          rm -f "$P/cloud_manager.lua" "$P/zenui_bridge.lua" "$P/PUBLIC_V4_README.txt"

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Validate exact field-tested source and safety boundary
        run: |
          set -eu
          S=packages/ghostguard/source
          P="$S/payload/dcghostguardpro.koplugin"

          grep -q 'version = "0.9.2"' "$P/defaults.lua"
          grep -q 'runtime_revision = "mtguard5-adaptive-v3-stable"' "$P/defaults.lua"
          grep -q 'function GhostGuard:guardMalformedMtFrame' "$P/ghostguard_core.lua"
          grep -q 'function Adaptive:fastTrackEligible' "$P/adaptive_bootstrap.lua"
          grep -q '/mnt/us/GhostGuard_Reports/' "$P/defaults.lua"

          test "$(sha256sum "$S/install.sh" | awk '{print $1}')" = "e8f19294553ccb732eede3703d792a1e773dc0e23fce163c3fef5d62ccbb08da"
          test "$(sha256sum "$S/manifest.json" | awk '{print $1}')" = "b9372e8637ae0788e92dd4387a01471995db1d9f4094350309a891881bc7f0f2"
          test "$(sha256sum "$P/adaptive_bootstrap.lua" | awk '{print $1}')" = "54245e36fca08055f314c23162772659b44a60850a951285c584fd3ee90813da"
          test "$(sha256sum "$P/defaults.lua" | awk '{print $1}')" = "134af061c0abf4b5a94602ea241af724244cc717fee4d0e84d8513be9e843db8"
          test "$(sha256sum "$P/ghostguard_core.lua" | awk '{print $1}')" = "01eb6d4b977aeff25e50e691a955e7b38b601a74e2381e409ac58630be118fe9"
          test "$(sha256sum "$P/main.lua" | awk '{print $1}')" = "d2d8e351ba8fe06a0cc01c3bd50fdb88cbc2175ba0a369c48c2ed622f00bbe8e"
          test "$(sha256sum "$P/simpleui_bridge.lua" | awk '{print $1}')" = "f4d62ce81920960ed5be6529f05334db728d56f53f9ad88d05ea88129cc31a45"
          test "$(sha256sum "$P/storage.lua" | awk '{print $1}')" = "9e5fb761755b03f7e9b75cb72413c37d3a3a9c17fb6b983bc54794d3e597e586"

          test ! -e "$P/cloud_manager.lua"
          test ! -e "$P/zenui_bridge.lua"
          test ! -e "$P/PUBLIC_V4_README.txt"

          if ls "$S"/assets/ghostguard_library_600x960.jpg.b64.* >/dev/null 2>&1; then
            cat "$S"/assets/ghostguard_library_600x960.jpg.b64.* | tr -d '\r\n' | base64 -d > /tmp/gg092-cover.jpg
            test "$(wc -c < /tmp/gg092-cover.jpg | tr -d ' ')" = "90780"
            test "$(sha256sum /tmp/gg092-cover.jpg | awk '{print $1}')" = "0cbfa7a143a52eb6c23cf75afa4b1d3395cbbeed8f0a83bbb315ccc3b9edad8e"
            echo "Cover: approved 0.9.2 public artwork"
          else
            test -s "$S/assets/ghostguard_library_600x960.jpg"
            cp "$S/assets/ghostguard_library_600x960.jpg" /tmp/gg092-cover.jpg
            python3 -c "from pathlib import Path; p=Path('/tmp/gg092-cover.jpg').read_bytes(); assert len(p)>=10000; assert p[:2]==b'\\xff\\xd8'; print('Cover: stable existing public JPEG fallback', len(p))"
          fi

          grep -q 'NATIVE_FILTER=SHADOW_ONLY' "$S/install.sh"
          grep -q 'INPUT_GRAB=OFF' "$S/install.sh"
          grep -q 'EVENT_INJECTION=OFF' "$S/install.sh"

          sh -n "$S/install.sh"
          sh -n "$S/uninstall.sh"
          sh -n "$S/launch.sh"
          sh -n scripts/build_ghostguard_v092.sh
          sh -n DCPRO_GhostGuard_OneClick_Installer_v14.sh

          for f in "$P"/*.lua "$P"/keys/*.lua; do
            luajit -b "$f" /dev/null
          done

      - name: Build deterministic artifact twice
        id: build
        run: |
          set -eu
          chmod +x scripts/build_ghostguard_v092.sh
          scripts/build_ghostguard_v092.sh
          first="$(sha256sum packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg | awk '{print $1}')"
          cp packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg /tmp/gg092-first.kpkg
          scripts/build_ghostguard_v092.sh
          second="$(sha256sum packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg | awk '{print $1}')"
          test "$first" = "$second"
          cmp /tmp/gg092-first.kpkg packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg
          echo "Artifact SHA-256: $first"
          echo "sha=$first" >> "$GITHUB_OUTPUT"

      - name: Pin OneClick v14 to verified artifact
        run: |
          set -eu
          SHA='${{ steps.build.outputs.sha }}'
          test "${#SHA}" = "64"
          sed -E -i "s/^GG_SHA256=\"[0-9a-f]{64}\"/GG_SHA256=\"$SHA\"/" DCPRO_GhostGuard_OneClick_Installer_v14.sh
          grep -q "GG_SHA256=\"$SHA\"" DCPRO_GhostGuard_OneClick_Installer_v14.sh
          sh -n DCPRO_GhostGuard_OneClick_Installer_v14.sh

      - name: Validate packaged artifact
        run: |
          set -eu
          rm -rf /tmp/gg092 && mkdir -p /tmp/gg092
          tar -xzf packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg -C /tmp/gg092
          grep -q 'version = "0.9.2"' /tmp/gg092/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'runtime_revision = "mtguard5-adaptive-v3-stable"' /tmp/gg092/payload/dcghostguardpro.koplugin/defaults.lua
          test ! -e /tmp/gg092/payload/dcghostguardpro.koplugin/cloud_manager.lua
          test ! -e /tmp/gg092/payload/dcghostguardpro.koplugin/zenui_bridge.lua
          cmp /tmp/gg092-cover.jpg /tmp/gg092/assets/ghostguard_library_600x960.jpg
          cmp /tmp/gg092-cover.jpg /tmp/gg092/payload/dcghostguardpro.koplugin/assets/ghostguard_library_600x960.jpg
          grep -q 'REPORT_MODE=LOCAL_ONLY_NON_LIBRARY' /tmp/gg092/install.sh
          grep -q 'CLOUD_UPLOAD=REMOVED' /tmp/gg092/install.sh
          grep -q 'NATIVE_FILTER=SHADOW_ONLY' /tmp/gg092/install.sh
          grep -q 'INPUT_GRAB=OFF' /tmp/gg092/install.sh
          grep -q 'EVENT_INJECTION=OFF' /tmp/gg092/install.sh

      - name: Commit verified source and artifact on release branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/v0.9.2-mtguard5-final' }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .release-exact .release-patch .release-v092
          git add -A -- \
            packages/ghostguard/source \
            packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg \
            DCPRO_GhostGuard_OneClick_Installer_v14.sh \
            .release-exact .release-patch .release-v092
          if ! git diff --cached --quiet; then
            git commit -m "[release-v092] materialize verified MTGuard5 source and artifact"
            git push origin HEAD:v0.9.2-mtguard5-final
          fi
