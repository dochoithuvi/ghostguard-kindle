name: Publish IntentShield 1.2.1 RC1
on:
  push:
    branches: [main]
    paths: ['packages/intentshield/releases/1.2.1-rc1/**', '.github/workflows/publish-intentshield-1.2.1-rc1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-intentshield-1.2.1-rc1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Lua syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Verify exact signed RC assets and recovery tests
        run: python3 packages/intentshield/releases/1.2.1-rc1/verify_release.py
      - name: Verify pinned Kindle Library upstream archive
        run: |
          set -eu
          curl -fLsS --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 300 https://github.com/kaikozlov/kindle.koplugin/releases/download/v0.0.11/kindle-koplugin-armv7.zip -o /tmp/kindle-library.zip
          echo 'fbbda29e0d46a54ab9d3d8ddf9b606f02341ef789f45bd3463bcda05d853b330  /tmp/kindle-library.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, stat
          with zipfile.ZipFile('/tmp/kindle-library.zip') as z:
              assert z.testzip() is None
              assert {'kindle.koplugin/main.lua','kindle.koplugin/_meta.lua'}.issubset(z.namelist())
              for f in z.infolist():
                  p=pathlib.PurePosixPath(f.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(f.external_attr>>16), f.filename
              assert b'v0.0.11' in z.read('kindle.koplugin/_meta.lua')
          PY
      - name: Publish RC without replacing Latest Stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd packages/intentshield/releases/1.2.1-rc1
          gh release create intentshield-v1.2.1-rc1 DCPRO_IntentShield_OneClick_Install.sh DCPRO_IntentShield_1.2.1_RC1_OneClick.zip IntentShield_UPDATE.manifest IntentShield_UPDATE.sig IntentShield_UPDATE.zip SHA256SUMS README.md test_recovery.lua --target "$GITHUB_SHA" --title "DCPRO IntentShield™ 1.2.1 RC1 — Touch Recovery V2" --notes-file README.md --prerelease --latest=false
          gh release view intentshield-v1.2.1-rc1 --json tagName,isDraft,isPrerelease,url,assets
