name: Apply OneClick preflight KPM update

on:
  push:
    branches:
      - agent/oneclick-preflight-kpm-update

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[oneclick-preflight-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oneclick-preflight-kpm-update
          fetch-depth: 0
      - name: Add preflight KPM update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DCPRO_GhostGuard_OneClick_Installer_v12.1.sh')
          s = p.read_text(encoding='utf-8')
          anchor = '''  say 1 "DCPRO GhostGuard Installer v12.1"\n  say 2 "KPM v2 + KOReader safety guards"\n\n  install_ko || { log "ERROR: KOReader install failed"; say 5 "LOI: Khong cai duoc KOReader"; exit 1; }\n'''
          repl = '''  say 1 "DCPRO GhostGuard Installer v12.1"\n  say 2 "KPM v2 + KOReader safety guards"\n\n  # Match the reliable manual recovery sequence: refresh KPM first, then run\n  # the existing OneClick flow unchanged. A partial update failure is logged\n  # but does not block installation because an unrelated repository may fail.\n  say 3 "[0/9] KPM update..."\n  PREFLIGHT_UPDATE_RC=0\n  run "$KPM" -y update || PREFLIGHT_UPDATE_RC=$?\n  if [ "$PREFLIGHT_UPDATE_RC" -eq 0 ]; then\n    log "OneClick preflight KPM update: PASS"\n  else\n    log "WARN: OneClick preflight KPM update returned rc=$PREFLIGHT_UPDATE_RC; continuing with the previous installer flow."\n  fi\n\n  install_ko || { log "ERROR: KOReader install failed"; say 5 "LOI: Khong cai duoc KOReader"; exit 1; }\n'''
          if repl not in s:
              if anchor not in s:
                  raise SystemExit('main preflight anchor not found')
              s = s.replace(anchor, repl, 1)
          p.write_text(s, encoding='utf-8')
          PY
          sh -n DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'OneClick preflight KPM update: PASS' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          grep -q 'run "$KPM" -y update || PREFLIGHT_UPDATE_RC=' DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          git diff --check
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh KPM before OneClick flow [oneclick-preflight-bot]"
          git push origin HEAD:agent/oneclick-preflight-kpm-update
