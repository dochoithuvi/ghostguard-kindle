name: Publish GhostGuard 0.6.16 artifact
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.head_ref == 'agent/publish-0616-artifact' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-0616-artifact
      - name: Build and validate GhostGuard 0.6.16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          chmod +x scripts/build_artifact_v0612.sh
          scripts/build_artifact_v0612.sh
          PKG=packages/ghostguard/artifacts/ghostguard_0.6.16_kindle5-kindlepw2-kindlehf.kpkg
          test -s "$PKG"
          rm -rf /tmp/gg0616 && mkdir -p /tmp/gg0616
          tar -xzf "$PKG" -C /tmp/gg0616
          grep -q 'version = "0.6.16"' /tmp/gg0616/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'runtime_revision = "calibration-flow-v2"' /tmp/gg0616/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'CALIBRATION_INPUT:' /tmp/gg0616/payload/dcghostguardpro.koplugin/ghostguard.lua
          grep -q '_resume_calibration_after_suspend' /tmp/gg0616/payload/dcghostguardpro.koplugin/main.lua
          grep -q 'function ProfileManager:checkpoint()' /tmp/gg0616/payload/dcghostguardpro.koplugin/profile_manager.lua
      - name: Commit artifact only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ghostguard/artifacts/ghostguard_0.6.16_kindle5-kindlepw2-kindlehf.kpkg
          git diff --cached --quiet && exit 0
          git commit -m "build: publish GhostGuard 0.6.16 artifact [artifact-0616-bot]"
          git push origin HEAD:agent/publish-0616-artifact
