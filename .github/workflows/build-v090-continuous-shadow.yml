name: GhostGuard v0.9.0 continuous learning + native shadow

on:
  push:
    branches: [v0.9.0-continuous-shadow]

permissions:
  contents: write

jobs:
  build-v090:
    if: ${{ !contains(github.event.head_commit.message, '[artifact-v090]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Patch v0.9 runtime, service and package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def must_replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"anchor missing in {path}: {old[:100]!r}")
              s = s.replace(old, new, count)
              p.write_text(s)

          # Runtime version and low-overhead continuous-learning policy.
          p = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua')
          s = p.read_text()
          s = s.replace('version = "0.8.0"', 'version = "0.9.0"', 1)
          s = s.replace('runtime_revision = "system-service-v1"', 'runtime_revision = "continuous-learning-shadow-v1"', 1)
          if 'cloud_upload_enabled = false' not in s:
              s = s.replace('cloud_compress_threshold = 2000000,', 'cloud_compress_threshold = 2000000,\n    cloud_upload_enabled = false,', 1)
          anchor = '    adaptive_learning_during_protect = true,\n'
          extra = '''    adaptive_learning_during_protect = true,\n    -- v0.9 continuous learning is event-driven. Normal touches do only a few\n    -- arithmetic checks; flash is checkpointed only after strong anomalies.\n    adaptive_min_base_score = 7,\n    adaptive_cluster_radius_px = 96,\n    adaptive_checkpoint_samples = 8,\n    adaptive_checkpoint_seconds = 120,\n    adaptive_promotion_min_cluster = 6,\n    adaptive_promotion_min_confidence = 0.72,\n    adaptive_promotion_min_age_seconds = 30,\n    adaptive_max_clusters = 32,\n    adaptive_max_candidate_clusters = 32,\n    native_shadow_enabled = true,\n'''
          if 'adaptive_promotion_min_cluster' not in s:
              if anchor not in s: raise SystemExit('defaults adaptive anchor missing')
              s = s.replace(anchor, extra, 1)
          p.write_text(s)

          # User-visible plugin metadata.
          p = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/_meta.lua')
          s = p.read_text()
          s = re.sub(r'GhostGuard v0\.8\.0:[^"]*',
              'GhostGuard v0.9.0: continuous low-power profile learning plus a read-only system-wide native shadow observer; actual blocking remains fail-open in KOReader while native filtering is validated.', s, count=1)
          p.write_text(s)

          # Actually install adaptive_bootstrap.lua into the live runtime. It existed
          # in older packages but was never loaded from main.lua.
          p = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua')
          s = p.read_text()
          anchor = '    self.config, self.guard = config, guard_or_err\n'
          adaptive_loader = '''    self.config, self.guard = config, guard_or_err\n\n    -- v0.9: continuous adaptive learning. Failure here must never prevent the\n    -- proven core protection path from loading.\n    local AdaptiveBootstrap, adaptive_err = load_local("adaptive_bootstrap.lua")\n    if AdaptiveBootstrap then\n        local call_ok, install_ok, adaptive_or_err = pcall(AdaptiveBootstrap, self.guard, config)\n        if call_ok and install_ok == true then\n            self.adaptive = adaptive_or_err\n            logger.info("DCPRO GhostGuard continuous learning v0.9 loaded")\n        else\n            logger.warn("DCPRO GhostGuard adaptive learning unavailable:",\n                call_ok and adaptive_or_err or install_ok)\n        end\n    else\n        logger.warn("DCPRO GhostGuard adaptive bootstrap missing:", adaptive_err)\n    end\n'''
          if 'continuous learning v0.9 loaded' not in s:
              if anchor not in s: raise SystemExit('main runtime anchor missing')
              s = s.replace(anchor, adaptive_loader, 1)
          s = s.replace('Dừng và tạo báo cáo báo cáo Cloud', 'Tạo báo cáo GhostGuard')
          s = s.replace('Trạng thái Cloud', 'Trạng thái báo cáo GhostGuard')
          p.write_text(s)

          # Core public build no longer duplicates each session into cloud_outbox.
          p = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard_core.lua')
          s = p.read_text()
          old = '''        local active_profile = self.profiles:hasApproved() and self.profiles.approved_path\n            or (self.profiles.pending and self.profiles.pending_path or nil)\n        local out_ok, out_result = self.storage:prepareCloudOutbox(session, {\n            device_id = self.device_id,\n            model = self.model,\n            profile_path = active_profile,\n        })\n        if out_ok then self.last_outbox = out_result end\n'''
          new = '''        if self.config.cloud_upload_enabled ~= false then\n            local active_profile = self.profiles:hasApproved() and self.profiles.approved_path\n                or (self.profiles.pending and self.profiles.pending_path or nil)\n            local out_ok, out_result = self.storage:prepareCloudOutbox(session, {\n                device_id = self.device_id,\n                model = self.model,\n                profile_path = active_profile,\n            })\n            if out_ok then self.last_outbox = out_result end\n        end\n'''
          if old not in s: raise SystemExit('core cloud outbox anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('return true, "stopped; report queued in cloud_outbox"', 'return true, "stopped; report saved locally"', 1)
          old_status = '''        "Báo cáo: " .. self.config.report_dir,\n        "Cloud outbox: " .. self.config.cloud_outbox_dir,\n        "Cloud Apps Script: ĐÃ CẤU HÌNH",\n        "Cloud worker: " .. (self.cloud:isBusy() and "ĐANG CHẠY" or "RẢNH"),\n        "Drive đích: " .. tostring(self.config.drive_root_folder_id),\n'''
          new_status = '''        "Báo cáo local: " .. self.config.report_dir,\n        "Cloud upload: TẮT trong bản public",\n'''
          if old_status in s: s = s.replace(old_status, new_status, 1)
          p.write_text(s)

          # v0.9 wrapper wording only; suppression boundary is unchanged.
          p = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/ghostguard.lua')
          s = p.read_text()
          s = s.replace('runtime wrapper v0.8', 'runtime wrapper v0.9', 1)
          s = s.replace('runtime v0.8 loaded', 'runtime v0.9 loaded')
          s = s.replace('System service v0.8:', 'System service v0.9:')
          p.write_text(s)

          # KOReader bridge preserves the native-shadow preference when desired state changes.
          p = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/system_service.lua')
          s = p.read_text()
          s = s.replace('pause_during_sleep = bool01(parse(text, "PAUSE_DURING_SLEEP"), true),',
              'pause_during_sleep = bool01(parse(text, "PAUSE_DURING_SLEEP"), true),\n        native_shadow = bool01(parse(text, "NATIVE_SHADOW"), true),', 1)
          s = s.replace('"# DCPRO GhostGuard v0.8 persistent service policy",', '"# DCPRO GhostGuard v0.9 persistent service policy",', 1)
          s = s.replace('"PAUSE_DURING_SLEEP=" .. p.pause_during_sleep,\n        "DESIRED_MODE=" .. p.desired_mode,',
              '"PAUSE_DURING_SLEEP=" .. p.pause_during_sleep,\n        "NATIVE_SHADOW=" .. p.native_shadow,\n        "DESIRED_MODE=" .. p.desired_mode,', 1)
          old = '''    local fail_open = parse(status, "FAIL_OPEN") or "YES"\n    local safe, detail = self:controllerSafe()\n    local controller_state = safe and "OK" or ("CHANGED — " .. tostring(detail))\n    return string.format(\n        "System service v0.8: PID %s, power=%s\\nController: %s (%s) — %s\\nFail-open=%s; native grab/injection=OFF",\n        pid, power, controller, event, controller_state, fail_open)\n'''
          new = '''    local fail_open = parse(status, "FAIL_OPEN") or "YES"\n    local shadow = parse(status, "NATIVE_SHADOW") or "0"\n    local shadow_pid = parse(status, "NATIVE_SHADOW_PID") or "0"\n    local native_filter = parse(status, "NATIVE_FILTER") or "OFF"\n    local safe, detail = self:controllerSafe()\n    local controller_state = safe and "OK" or ("CHANGED — " .. tostring(detail))\n    return string.format(\n        "System service v0.9: PID %s, power=%s\\nController: %s (%s) — %s\\nFail-open=%s; Native shadow=%s (PID %s); Native filter=%s; grab/injection=OFF",\n        pid, power, controller, event, controller_state, fail_open, shadow, shadow_pid, native_filter)\n'''
          if old not in s: raise SystemExit('system_service status anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # System supervisor: launch the LuaJIT read-only shadow observer while awake.
          p = Path('packages/ghostguard/source/system/ghostguard-service.sh')
          s = p.read_text()
          s = s.replace('# DCPRO GhostGuard v0.8 system supervisor.', '# DCPRO GhostGuard v0.9 system supervisor.', 1)
          s = s.replace('VERSION="0.8.0"', 'VERSION="0.9.0"', 1)
          anchor = 'CONTROLLER_CHANGED="$SERVICE_DIR/CONTROLLER_CHANGED"\n'
          extra = '''CONTROLLER_CHANGED="$SERVICE_DIR/CONTROLLER_CHANGED"\nSHADOW_SCRIPT="$SERVICE_DIR/ghostguard-native-shadow.lua"\nSHADOW_PIDFILE="$SERVICE_DIR/native-shadow.pid"\nSHADOW_STATUS="$SERVICE_DIR/native-shadow.status"\nSHADOW_SPOOL="$SERVICE_DIR/native-shadow-candidates.log"\nSHADOW_PAUSE="$SERVICE_DIR/native-shadow.pause"\n'''
          if 'SHADOW_SCRIPT=' not in s:
              if anchor not in s: raise SystemExit('service vars anchor missing')
              s = s.replace(anchor, extra, 1)
          s = s.replace('# DCPRO GhostGuard v0.8 persistent service policy', '# DCPRO GhostGuard v0.9 persistent service policy')
          s = s.replace('PAUSE_DURING_SLEEP=1\nDESIRED_MODE=AUTO', 'PAUSE_DURING_SLEEP=1\nNATIVE_SHADOW=1\nDESIRED_MODE=AUTO', 1)
          s = s.replace('    PAUSE_DURING_SLEEP=1\n    DESIRED_MODE=AUTO', '    PAUSE_DURING_SLEEP=1\n    NATIVE_SHADOW=1\n    DESIRED_MODE=AUTO', 1)
          s = s.replace('            PAUSE_DURING_SLEEP) [ "$value" = "0" ] && PAUSE_DURING_SLEEP=0 || PAUSE_DURING_SLEEP=1 ;;\n            DESIRED_MODE)',
              '            PAUSE_DURING_SLEEP) [ "$value" = "0" ] && PAUSE_DURING_SLEEP=0 || PAUSE_DURING_SLEEP=1 ;;\n            NATIVE_SHADOW) [ "$value" = "0" ] && NATIVE_SHADOW=0 || NATIVE_SHADOW=1 ;;\n            DESIRED_MODE)', 1)
          helper_anchor = '}\n\n# Single instance without relying on flock (not present on every Kindle build).'
          helper = '''}\n\npid_is_shadow() {\n    pid="$1"\n    case "$pid" in ''|*[!0-9]*) return 1 ;; esac\n    kill -0 "$pid" 2>/dev/null || return 1\n    [ -r "/proc/$pid/cmdline" ] || return 1\n    tr '\\000' ' ' < "/proc/$pid/cmdline" 2>/dev/null | grep -Fq 'ghostguard-native-shadow.lua'\n}\n\nfind_luajit() {\n    for bin in "$ROOT/koreader/luajit" "$ROOT/koreader/bin/luajit" \\\n        "$ROOT/extensions/koreader/luajit" "$ROOT/extensions/koreader/bin/luajit"; do\n        if [ -x "$bin" ]; then printf '%s\\n' "$bin"; return 0; fi\n    done\n    command -v luajit 2>/dev/null || true\n}\n\nstop_shadow() {\n    if [ -r "$SHADOW_PIDFILE" ]; then\n        spid="$(cat "$SHADOW_PIDFILE" 2>/dev/null || true)"\n        if pid_is_shadow "$spid"; then kill "$spid" 2>/dev/null || true; fi\n    fi\n    rm -f "$SHADOW_PIDFILE" 2>/dev/null || true\n}\n\nstart_shadow() {\n    [ "${ENABLED:-1}" = "1" ] || { stop_shadow; return 0; }\n    [ "${NATIVE_SHADOW:-1}" = "1" ] || { stop_shadow; return 0; }\n    [ -r "$SHADOW_SCRIPT" ] || return 1\n    event="${CONTROLLER_EVENT:-NONE}"\n    [ "$event" != "NONE" ] && [ -r "/dev/input/$event" ] || return 1\n    if [ -r "$SHADOW_PIDFILE" ]; then\n        spid="$(cat "$SHADOW_PIDFILE" 2>/dev/null || true)"\n        if pid_is_shadow "$spid"; then return 0; fi\n        rm -f "$SHADOW_PIDFILE" 2>/dev/null || true\n    fi\n    lua="$(find_luajit)"\n    [ -n "$lua" ] || return 1\n    did="$(tr -cd 'A-Za-z0-9' < /proc/usid 2>/dev/null | tr '[:lower:]' '[:upper:]' || true)"\n    [ -n "$did" ] || did="UNKNOWNDEVICE"\n    profile="$DATA/profiles/$did.approved.profile"\n    "$lua" "$SHADOW_SCRIPT" "/dev/input/$event" "$SHADOW_SPOOL" "$SHADOW_STATUS" "$SHADOW_PAUSE" "$profile" >/dev/null 2>&1 &\n    spid=$!\n    printf '%s\\n' "$spid" > "$SHADOW_PIDFILE" 2>/dev/null || true\n    return 0\n}\n\n# Single instance without relying on flock (not present on every Kindle build).'''
          if 'pid_is_shadow()' not in s:
              if helper_anchor not in s: raise SystemExit('service helper anchor missing')
              s = s.replace(helper_anchor, helper, 1)
          s = s.replace('cleanup() { rm -f "$PIDFILE" 2>/dev/null || true; }',
              'cleanup() { stop_shadow; rm -f "$SHADOW_PAUSE" "$PIDFILE" 2>/dev/null || true; }', 1)
          s = s.replace('        echo "PAUSE_DURING_SLEEP=$PAUSE_DURING_SLEEP"\n        echo "DESIRED_MODE=${DESIRED_MODE:-AUTO}"',
              '        echo "PAUSE_DURING_SLEEP=$PAUSE_DURING_SLEEP"\n        echo "NATIVE_SHADOW=$NATIVE_SHADOW"\n        shadow_pid="$(cat "$SHADOW_PIDFILE" 2>/dev/null || echo 0)"\n        if ! pid_is_shadow "$shadow_pid"; then shadow_pid=0; fi\n        echo "NATIVE_SHADOW_PID=$shadow_pid"\n        echo "NATIVE_FILTER=SHADOW_ONLY"\n        echo "DESIRED_MODE=${DESIRED_MODE:-AUTO}"', 1)
          s = s.replace('    write_status "active" "WAKE"\n}',
              '    rm -f "$SHADOW_PAUSE" 2>/dev/null || true\n    start_shadow || true\n    write_status "active" "WAKE"\n}', 1)
          startup_anchor = 'state="$(power_state)"\nprev_state="$state"\nlast_heartbeat='
          startup_new = 'state="$(power_state)"\nprev_state="$state"\nrm -f "$SHADOW_PAUSE" 2>/dev/null || true\nif is_active_state "$state"; then start_shadow || true; else stop_shadow; fi\nlast_heartbeat='
          if startup_anchor not in s: raise SystemExit('service startup anchor missing')
          s = s.replace(startup_anchor, startup_new, 1)
          s = s.replace('        else\n            write_status "$state" "POWER_TRANSITION"\n        fi',
              '        else\n            stop_shadow\n            write_status "$state" "POWER_TRANSITION"\n        fi', 1)
          loop_anchor = '        prev_state="$state"\n    fi\n\n    now="$(date +%s 2>/dev/null || echo 0)"'
          loop_new = '        prev_state="$state"\n    fi\n\n    if is_active_state "$state"; then start_shadow || true; else stop_shadow; fi\n\n    now="$(date +%s 2>/dev/null || echo 0)"'
          if loop_anchor not in s: raise SystemExit('service loop anchor missing')
          s = s.replace(loop_anchor, loop_new, 1)
          p.write_text(s)

          # Installer carries the shadow observer beside the existing supervisor.
          p = Path('packages/ghostguard/source/install.sh')
          s = p.read_text()
          s = s.replace('NATIVE_CAPTURE="$SERVICE_DIR/ghostguard-native-capture.sh"',
              'NATIVE_CAPTURE="$SERVICE_DIR/ghostguard-native-capture.sh"\nNATIVE_SHADOW="$SERVICE_DIR/ghostguard-native-shadow.lua"', 1)
          s = s.replace('[ -f "system/ghostguard-native-capture.sh" ] || fail "integrated native diagnostics missing"',
              '[ -f "system/ghostguard-native-capture.sh" ] || fail "integrated native diagnostics missing"\n[ -f "system/ghostguard-native-shadow.lua" ] || fail "native shadow observer missing"', 1)
          s = s.replace('cp -p "system/ghostguard-native-capture.sh" "$NATIVE_CAPTURE" || fail "cannot install native diagnostic capture"',
              'cp -p "system/ghostguard-native-capture.sh" "$NATIVE_CAPTURE" || fail "cannot install native diagnostic capture"\ncp -p "system/ghostguard-native-shadow.lua" "$NATIVE_SHADOW" || fail "cannot install native shadow observer"', 1)
          s = s.replace('chmod 755 "$SERVICE_SCRIPT" "$NATIVE_CAPTURE" 2>/dev/null || true',
              'chmod 755 "$SERVICE_SCRIPT" "$NATIVE_CAPTURE" 2>/dev/null || true\nchmod 644 "$NATIVE_SHADOW" 2>/dev/null || true', 1)
          s = s.replace('# DCPRO GhostGuard v0.8 persistent service policy', '# DCPRO GhostGuard v0.9 persistent service policy')
          s = s.replace('PAUSE_DURING_SLEEP=1\nDESIRED_MODE=AUTO', 'PAUSE_DURING_SLEEP=1\nNATIVE_SHADOW=1\nDESIRED_MODE=AUTO', 1)
          s = s.replace('PACKAGE_VERSION=0.8.3', 'PACKAGE_VERSION=0.9.0')
          s = s.replace('NATIVE_INTEGRATED=1\\nINPUT_GRAB=OFF', 'NATIVE_INTEGRATED=1\\nNATIVE_SHADOW=1\\nNATIVE_FILTER=SHADOW_ONLY\\nINPUT_GRAB=OFF', 1)
          s = s.replace('GhostGuard v0.8.3 installed.', 'GhostGuard v0.9.0 installed.')
          s = s.replace('GhostGuard Native diagnostics integrated: $NATIVE_CAPTURE',
              'GhostGuard Native diagnostics integrated: $NATIVE_CAPTURE\necho "GhostGuard Native shadow observer: $NATIVE_SHADOW (read-only, event-driven)"', 1)
          s = s.replace('Safety: system service input grab/injection are OFF; Protect remains in the tested KOReader bridge.',
              'Safety: Native filter is SHADOW_ONLY; input grab/injection are OFF; actual blocking remains in the tested KOReader bridge.', 1)
          s = s.replace('Restart KOReader once after upgrading to v0.8.3.', 'Restart KOReader once after upgrading to v0.9.0.')
          p.write_text(s)

          # Builder packages and validates the new system-side Lua observer.
          p = Path('scripts/build_ghostguard_v080.sh')
          s = p.read_text()
          s = s.replace('VERSION=0.8.0', 'VERSION=0.9.0', 1)
          s = s.replace('cp "$SRC/system/ghostguard-native-capture.sh" "$TMP/system/ghostguard-native-capture.sh"',
              'cp "$SRC/system/ghostguard-native-capture.sh" "$TMP/system/ghostguard-native-capture.sh"\ncp "$SRC/system/ghostguard-native-shadow.lua" "$TMP/system/ghostguard-native-shadow.lua"', 1)
          s = s.replace('grep -q \'version = "0.8.0"\' "$PLUGIN/defaults.lua"', 'grep -q \'version = "0.9.0"\' "$PLUGIN/defaults.lua"')
          s = s.replace('grep -q \'runtime_revision = "system-service-v1"\' "$PLUGIN/defaults.lua"', 'grep -q \'runtime_revision = "continuous-learning-shadow-v1"\' "$PLUGIN/defaults.lua"')
          s = s.replace('grep -q \'GhostGuard v0.8.0\' "$PLUGIN/_meta.lua"', 'grep -q \'GhostGuard v0.9.0\' "$PLUGIN/_meta.lua"')
          s = s.replace('grep -q \'INPUT_GRAB=OFF\' "$TMP/system/ghostguard-service.sh"',
              'grep -q \'INPUT_GRAB=OFF\' "$TMP/system/ghostguard-service.sh"\ngrep -q \'NATIVE_FILTER=SHADOW_ONLY\' "$TMP/system/ghostguard-service.sh"\ngrep -q \'READ_ONLY_SHADOW\' "$TMP/system/ghostguard-native-shadow.lua"\ngrep -q \'continuous learning v0.9 loaded\' "$PLUGIN/main.lua"', 1)
          s = s.replace('    for f in "$PLUGIN"/*.lua "$PLUGIN"/keys/*.lua; do\n        luajit -b "$f" /dev/null\n    done',
              '    for f in "$PLUGIN"/*.lua "$PLUGIN"/keys/*.lua "$TMP/system/ghostguard-native-shadow.lua"; do\n        luajit -b "$f" /dev/null\n    done', 1)
          p.write_text(s)

          # Package and repository manifests.
          p = Path('packages/ghostguard/source/manifest.json')
          data = json.loads(p.read_text())
          data['version'] = [0, 9, 0]
          data['description'] = ('GhostGuard v0.9.0 - continuous low-power adaptive profile learning, '
              'read-only system-wide native shadow observation, reliable Library icon, and local-only reporting.')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          entry = '        {"url":"packages/ghostguard/artifacts/ghostguard_0.9.0_kindle5-kindlepw2-kindlehf.kpkg","version":[0,9,0],"dependencies":[],"supported_platforms":["kindle5","kindlepw2","kindlehf"]},\n'
          for name in ['manifest.v2.json', 'manifest.mirror.json', 'manifest.json']:
              p = Path(name)
              s = p.read_text()
              if 'ghostguard_0.9.0_kindle5-kindlepw2-kindlehf.kpkg' not in s:
                  marker = '      "artifacts": [\n'
                  if marker not in s: raise SystemExit(f'manifest artifacts anchor missing: {name}')
                  s = s.replace(marker, marker + entry, 1)
              s = re.sub(r'GhostGuard v0\.8\.3[^\"]*',
                  'GhostGuard v0.9.0 - continuous low-power adaptive learning and read-only native shadow observation; blocking remains fail-open in KOReader while native filtering is validated.',
                  s, count=1)
              p.write_text(s)
          PY

      - name: Validate v0.9 source and safety boundary
        run: |
          set -eu
          grep -q 'version = "0.9.0"' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'runtime_revision = "continuous-learning-shadow-v1"' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'adaptive_promotion_min_cluster = 6' packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua
          grep -q 'continuous learning v0.9 loaded' packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua
          grep -q 'ADAPTIVE_PROFILE_PROMOTE' packages/ghostguard/source/payload/dcghostguardpro.koplugin/adaptive_bootstrap.lua
          grep -q 'MODE=READ_ONLY_SHADOW' packages/ghostguard/source/system/ghostguard-native-shadow.lua
          grep -q 'NATIVE_FILTER=SHADOW_ONLY' packages/ghostguard/source/system/ghostguard-service.sh
          grep -q 'INPUT_GRAB=OFF' packages/ghostguard/source/system/ghostguard-service.sh
          grep -q 'EVENT_INJECTION=OFF' packages/ghostguard/source/system/ghostguard-service.sh
          ! grep -Eq '/dev/uinput|EVIOCGRAB' packages/ghostguard/source/system/ghostguard-service.sh
          grep -q '"version": \[' packages/ghostguard/source/manifest.json
          grep -q '0.9.0' packages/ghostguard/source/manifest.json
          sh -n packages/ghostguard/source/install.sh
          sh -n packages/ghostguard/source/system/ghostguard-service.sh
          luajit -b packages/ghostguard/source/system/ghostguard-native-shadow.lua /dev/null
          for f in packages/ghostguard/source/payload/dcghostguardpro.koplugin/*.lua; do luajit -b "$f" /dev/null; done

      - name: Exercise continuous-learning promotion
        run: |
          luajit - <<'LUA'
          local mem = {}
          local storage = {}
          function storage:readFile(p) return mem[p] end
          function storage:writeAtomic(p, t) mem[p] = t; return true end
          function storage:touch(p, t) mem[p] = t or ""; return true end
          function storage:removeExact(p) mem[p] = nil; return true end

          local approved = { ready=true, profile_kind="BASELINE", clusters={}, suspect_contacts=0 }
          local profiles = { approved=approved, approved_path="approved.profile" }
          function profiles:hasApproved() return true end
          function profiles:match(x, y)
              for i,c in ipairs(self.approved.clusters) do
                  if x and y and c.x_min and c.x_max and c.y_min and c.y_max
                      and x >= c.x_min - 36 and x <= c.x_max + 36
                      and y >= c.y_min - 56 and y <= c.y_max + 56 then
                      return {index=i, confidence=c.confidence, count=c.count}
                  end
              end
          end
          function profiles:serialize(p, status) return "APPROVED=" .. tostring(#p.clusters) .. "\n" end

          local guard = {
              storage=storage, profiles=profiles,
              config={protect_mode="PROTECT_PROFILE"},
              session=nil,
          }
          guard.observer = nil
          function guard:start(mode)
              self.observer = { evaluateProtect=function() return nil end }
              return true, "session"
          end
          function guard:stop() self.observer=nil; return true, "stopped" end
          function guard:statusText() return "status" end
          function guard:resetProfile() return true, "reset" end

          local cfg = {
              data_dir="/tmp/gg", protect_mode="PROTECT_PROFILE",
              adaptive_profiles_enabled=true, adaptive_learning_during_protect=true,
              adaptive_min_base_score=7, adaptive_checkpoint_samples=8,
              adaptive_checkpoint_seconds=120, adaptive_promotion_min_cluster=6,
              adaptive_promotion_min_confidence=0.72,
              adaptive_promotion_min_age_seconds=30,
              adaptive_max_clusters=32, adaptive_max_candidate_clusters=32,
              adaptive_cluster_radius_px=96,
          }
          local bootstrap = dofile('packages/ghostguard/source/payload/dcghostguardpro.koplugin/adaptive_bootstrap.lua')
          local ok, adaptive = bootstrap(guard, cfg)
          assert(ok, adaptive)
          assert(guard:start(cfg.protect_mode))
          local normal = {x=500,y=600,base_score=1,learnable=false,short=false,low_major=false,incomplete=false,extreme_edge=false}
          for i=1,20 do guard.observer:evaluateProtect(normal) end
          assert(#profiles.approved.clusters == 0, 'normal touches must not be learned')
          local ghost = {x=500,y=600,base_score=7,learnable=true,short=true,low_major=true,incomplete=false,extreme_edge=false,timestamp_us=1}
          for i=1,10 do guard.observer:evaluateProtect(ghost) end
          assert(#profiles.approved.clusters == 1, 'strong repeated anomaly should be promoted')
          assert(profiles.approved.profile_kind == 'GHOST_CLUSTER')
          assert(mem['approved.profile'], 'approved profile must be persisted atomically')
          local stopped = guard:stop('test')
          assert(stopped)
          print('adaptive promotion test: OK')
          LUA

      - name: Build v0.9.0 KPM artifact
        run: |
          chmod +x scripts/build_ghostguard_v080.sh
          scripts/build_ghostguard_v080.sh
          test -s packages/ghostguard/artifacts/ghostguard_0.9.0_kindle5-kindlepw2-kindlehf.kpkg
          tar -tzf packages/ghostguard/artifacts/ghostguard_0.9.0_kindle5-kindlepw2-kindlehf.kpkg | grep -q 'system/ghostguard-native-shadow.lua'
          tar -xOf packages/ghostguard/artifacts/ghostguard_0.9.0_kindle5-kindlepw2-kindlehf.kpkg payload/dcghostguardpro.koplugin/defaults.lua | grep -q 'version = "0.9.0"'

