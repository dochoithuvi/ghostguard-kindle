        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/source scripts/build_ghostguard_v080.sh manifest.json manifest.v2.json manifest.mirror.json \
