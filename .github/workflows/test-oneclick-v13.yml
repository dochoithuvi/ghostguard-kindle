name: Test OneClick v13

on:
  push:
    branches: [oneclick-v13-simpleui]
  pull_request:
    paths:
      - DCPRO_GhostGuard_OneClick_Installer_v13.sh
      - .github/workflows/test-oneclick-v13.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: sh -n DCPRO_GhostGuard_OneClick_Installer_v13.sh
      - name: Verify fresh-device flow
        run: |
          set -eu
          f=DCPRO_GhostGuard_OneClick_Installer_v13.sh
          grep -F 'install_koreader_kpm' "$f"
          grep -F 'install_koreader_official' "$f"
          grep -F 'install_simpleui' "$f"
          grep -F 'features/sui_quickactions.lua' "$f"
          grep -F 'infra/sui_config.lua' "$f"
          grep -F 'engines/sui_window.lua' "$f"
          grep -F 'ghostguard_0.9.1_kindle5-kindlepw2-kindlehf.kpkg' "$f"
          grep -F 'continuous-learning-shadow-v1' "$f"
          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$f"
      - name: Enforce safe native mode
        run: |
          set -eu
          f=DCPRO_GhostGuard_OneClick_Installer_v13.sh
          ! grep -F 'EVIOCGRAB' "$f"
          ! grep -F '/dev/uinput' "$f"
          ! grep -F 'EVENT_INJECTION=ON' "$f"
