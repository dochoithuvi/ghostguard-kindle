# Release-gate recheck: publisher bot commits do not self-trigger Actions.
name: Test OneClick v14 MTGuard5 Golden

on:
  push:
    branches: [main]
    paths:
      - DCPRO_GhostGuard_OneClick_Installer_v14.sh
      - bootstrap/koreader-simpleui-v14.sh
      - packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg
      - packages/ghostguard/source/**
      - scripts/build_ghostguard_v092.sh
      - scripts/test_goodix_crashshield.lua
      - .github/workflows/test-oneclick-v14.yml
  pull_request:
    paths:
      - DCPRO_GhostGuard_OneClick_Installer_v14.sh
      - bootstrap/koreader-simpleui-v14.sh
      - packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg
      - packages/ghostguard/source/**
      - scripts/build_ghostguard_v092.sh
      - scripts/test_goodix_crashshield.lua
      - .github/workflows/test-oneclick-v14.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1

      - name: Shell syntax
        run: |
          sh -n DCPRO_GhostGuard_OneClick_Installer_v14.sh
          sh -n bootstrap/koreader-simpleui-v14.sh
          sh -n packages/ghostguard/source/install.sh
          sh -n scripts/build_ghostguard_v092.sh

      - name: Test Goodix crash shield regression contract
        run: |
          set -eu
          P=packages/ghostguard/source/payload/dcghostguardpro.koplugin
          lua5.1 scripts/test_goodix_crashshield.lua "$P/goodix_crashshield.lua"

          grep -F 'local CrashShield = dofile(plugin_dir .. "goodix_crashshield.lua")' "$P/ghostguard.lua"
          grep -F 'MT_GUARD_DROP_CORRUPT_CONTACT' "$P/goodix_crashshield.lua"
          grep -F 'TOUCH_SHIELD_RESET_STATE' "$P/goodix_crashshield.lua"
          grep -F 'PASS_THROUGH_SAFE' "$P/goodix_crashshield.lua"
          grep -F 'self.config.protect_wrapper_all_modes = true' "$P/goodix_crashshield.lua"
          grep -F 'Do NOT call restoreProtectWrapper() here' "$P/goodix_crashshield.lua"
          ! grep -F 'EVIOCGRAB' "$P/goodix_crashshield.lua"
          ! grep -F '/dev/uinput' "$P/goodix_crashshield.lua"

      - name: Build and inspect candidate MTGuard5 package
        run: |
          set -eu
          chmod +x scripts/build_ghostguard_v092.sh
          scripts/build_ghostguard_v092.sh
          a=packages/ghostguard/artifacts/ghostguard_0.9.2_kindle5-kindlepw2-kindlehf.kpkg
          test -s "$a"
          sha256sum "$a"

          rm -rf /tmp/gg-candidate && mkdir -p /tmp/gg-candidate
          tar -xzf "$a" -C /tmp/gg-candidate
          P=/tmp/gg-candidate/payload/dcghostguardpro.koplugin
          test -f "$P/goodix_crashshield.lua"
          grep -F 'version = "0.9.1-local-mtguard5"' "$P/defaults.lua"
          grep -F 'runtime_revision = "mtguard1-adaptive-v3-approved-cover-nocloud"' "$P/defaults.lua"
          grep -F 'goodix_crashshield.lua' "$P/ghostguard.lua"
          sh -n /tmp/gg-candidate/install.sh
          grep -F 'GOODIX_CRASH_SHIELD=1' /tmp/gg-candidate/install.sh
          grep -F 'TOUCH_SHIELD_MODE=PASS_THROUGH_SAFE' /tmp/gg-candidate/install.sh
          grep -F 'LIBRARY_ICON_MODE=EMBEDDED_PNG_FORCE_REINDEX' /tmp/gg-candidate/install.sh
          grep -F "grep -q '^# Icon: data:image/png;base64,iVBORw0KGgo'" /tmp/gg-candidate/install.sh
          ! grep -F 'awk -v icon=' /tmp/gg-candidate/install.sh

          launcher=/tmp/gg-candidate/scriptlets/DCPRO_GhostGuard.sh
          python3 - "$launcher" <<'PY'
          import base64, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          m = re.search(r'^# Icon: data:image/png;base64,([^\r\n]+)$', text, re.M)
          assert m, 'embedded icon header missing'
          raw = base64.b64decode(m.group(1), validate=True)
          assert raw.startswith(b'\x89PNG\r\n\x1a\n'), 'embedded icon is not PNG'
          assert len(raw) >= 1024, 'embedded icon unexpectedly small'
          print('Embedded launcher icon OK:', len(raw), 'bytes')
          PY

      - name: Verify published golden artifact and fresh-device contract
        run: |
          set -eu
          f=DCPRO_GhostGuard_OneClick_Installer_v14.sh
          b=bootstrap/koreader-simpleui-v14.sh
          a=packages/ghostguard/artifacts/ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg
          want="$(sed -n 's/^GG_SHA256="\([0-9a-f][0-9a-f]*\)"$/\1/p' "$f" | head -n1)"

          test -n "$want"
          test "${#want}" = 64
          test -s "$a"
          got="$(sha256sum "$a" | awk '{print $1}')"
          echo "Published golden SHA-256: $got"
          test "$got" = "$want"

          grep -F 'bootstrap/koreader-simpleui-v14.sh' "$f"
          grep -F 'GG_NAME="ghostguard_mtguard5_golden_kindle5-kindlepw2-kindlehf.kpkg"' "$f"
          grep -F "GG_SHA256=\"$want\"" "$f"
          grep -F 'GHOSTGUARD_VERSION=0.9.1-local-mtguard5' "$f"
          grep -F 'RUNTIME=mtguard1-adaptive-v3-approved-cover-nocloud' "$f"

          grep -F 'ensure_koreader' "$b"
          grep -F 'install_koreader_kpm' "$b"
          grep -F 'install_koreader_official' "$b"
          grep -F 'install_simpleui' "$b"
          grep -F 'features/sui_quickactions.lua' "$b"
          grep -F 'infra/sui_config.lua' "$b"
          grep -F 'engines/sui_window.lua' "$b"

          rm -rf /tmp/gg-fresh && mkdir -p /tmp/gg-fresh
          tar -xzf "$a" -C /tmp/gg-fresh
          test -f /tmp/gg-fresh/install.sh
          sh -n /tmp/gg-fresh/install.sh
          grep -F 'version = "0.9.1-local-mtguard5"' /tmp/gg-fresh/payload/dcghostguardpro.koplugin/defaults.lua
          grep -F 'runtime_revision = "mtguard1-adaptive-v3-approved-cover-nocloud"' /tmp/gg-fresh/payload/dcghostguardpro.koplugin/defaults.lua

      - name: Enforce safe native mode
        run: |
          set -eu
          f=DCPRO_GhostGuard_OneClick_Installer_v14.sh
          grep -F 'NATIVE_FILTER=SHADOW_ONLY' "$f"
          grep -F 'INPUT_GRAB=OFF' "$f"
          grep -F 'EVENT_INJECTION=OFF' "$f"
          ! grep -F 'EVIOCGRAB' "$f"
          ! grep -F '/dev/uinput' "$f"
