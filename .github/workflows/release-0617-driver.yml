name: GhostGuard 0.6.17 release driver

on:
  push:
    branches:
      - agent/release-0617-final

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[release-0617-final-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0617-final
          fetch-depth: 0
      - name: Apply 0.6.17 version bump
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          files = [
              Path('DCPRO_GhostGuard_OneClick_Installer_v12.1.sh'),
              Path('README.md'),
              Path('manifest.v2.json'),
              Path('manifest.json'),
              Path('manifest.mirror.json'),
              Path('packages/ghostguard/source/manifest.json'),
              Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua'),
              Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/_meta.lua'),
              Path('scripts/build_artifact_v0612.sh'),
              Path('.github/workflows/build-artifact-v0612.yml'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace('0.6.16', '0.6.17')
              s = s.replace('[0, 6, 16]', '[0, 6, 17]')
              s = s.replace('[0,6,16]', '[0,6,17]')
              p.write_text(s, encoding='utf-8')
          defaults = Path('packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua').read_text(encoding='utf-8')
          assert 'version = "0.6.17"' in defaults
          assert 'runtime_revision = "calibration-flow-v2"' in defaults
          assert '"version": [0, 6, 17]' in Path('packages/ghostguard/source/manifest.json').read_text(encoding='utf-8')
          assert 'GG_EXPECT=0.6.17' in Path('DCPRO_GhostGuard_OneClick_Installer_v12.1.sh').read_text(encoding='utf-8')
          assert 'ghostguard_0.6.17_kindle5-kindlepw2-kindlehf.kpkg' in Path('manifest.v2.json').read_text(encoding='utf-8')
          assert 'ghostguard_0.6.17_kindle5-kindlepw2-kindlehf.kpkg' in Path('manifest.json').read_text(encoding='utf-8')
          assert 'ghostguard_0.6.17_kindle5-kindlepw2-kindlehf.kpkg' in Path('manifest.mirror.json').read_text(encoding='utf-8')
          PY
          rm -f .github/workflows/release-0617-final.yml
      - name: Commit release bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "release GhostGuard 0.6.17 [release-0617-final-bot]"
          git push origin HEAD:agent/release-0617-final
