name: Apply OneClick LuaJIT probe fix

on:
  push:
    branches:
      - agent/fix-oneclick-luajit-probe

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[oneclick-luajit-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-oneclick-luajit-probe
          fetch-depth: 0
      - name: Patch OneClick LuaJIT detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('DCPRO_GhostGuard_OneClick_Installer_v12.1.sh')
          s = p.read_text(encoding='utf-8')
          old = '''koreader_find_luajit(){\n  KO_ROOT="$1"\n  if [ -x "$KO_ROOT/luajit" ]; then\n    printf '%s\\n' "$KO_ROOT/luajit"\n    return 0\n  fi\n  if command -v luajit >/dev/null 2>&1; then\n    command -v luajit\n    return 0\n  fi\n  return 1\n}\n'''
          new = '''koreader_find_luajit(){\n  KO_ROOT="$1"\n  CANDIDATE="$KO_ROOT/luajit"\n  if [ -x "$CANDIDATE" ]; then\n    if "$CANDIDATE" -e 'os.exit(0)' >/dev/null 2>&1; then\n      printf '%s\\n' "$CANDIDATE"\n      return 0\n    fi\n    log "WARN: bundled KOReader LuaJIT exists but cannot execute on this Kindle; syntax compile check will be skipped ($CANDIDATE)"\n  fi\n  CANDIDATE="$(command -v luajit 2>/dev/null || true)"\n  if [ -n "$CANDIDATE" ] && "$CANDIDATE" -e 'os.exit(0)' >/dev/null 2>&1; then\n    printf '%s\\n' "$CANDIDATE"\n    return 0\n  fi\n  return 1\n}\n'''
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('koreader_find_luajit anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          sh -n DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DCPRO_GhostGuard_OneClick_Installer_v12.1.sh
          git diff --cached --quiet && exit 0
          git commit -m "fix: tolerate unusable bundled KOReader LuaJIT [oneclick-luajit-fix-bot]"
          git push origin HEAD:agent/fix-oneclick-luajit-probe
