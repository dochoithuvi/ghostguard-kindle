name: Build GhostGuard v0.8.1 icon fix

on:
  push:
    branches: [v0.8.1-icon-fix]
    paths:
      - packages/ghostguard/source/**
      - scripts/build_ghostguard_v080.sh
      - .github/workflows/build-v081-icon-fix.yml
  pull_request:
    paths:
      - packages/ghostguard/source/**
      - scripts/build_ghostguard_v080.sh
      - .github/workflows/build-v081-icon-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
      - name: Validate icon fix and shell
        run: |
          set -eu
          grep -q '"version": \[0, 8, 1\]' packages/ghostguard/source/manifest.json
          grep -q 'LIBRARY_ICON_MODE=FILE_PATH_FORCE_REINDEX' packages/ghostguard/source/install.sh
          grep -q 'chmod 666 "$LIBRARY_COVER"' packages/ghostguard/source/install.sh
          grep -q 'rm -rf "$LAUNCHER_SDR"' packages/ghostguard/source/install.sh
          grep -q 'sleep 2' packages/ghostguard/source/install.sh
          sh -n packages/ghostguard/source/install.sh
          P=packages/ghostguard/source/payload/dcghostguardpro.koplugin
          for f in "$P"/*.lua "$P"/keys/*.lua; do luajit -b "$f" /dev/null; done
      - name: Build package
        run: |
          chmod +x scripts/build_ghostguard_v080.sh
          scripts/build_ghostguard_v080.sh
          test -s packages/ghostguard/artifacts/ghostguard_0.8.1_kindle5-kindlepw2-kindlehf.kpkg
      - name: Validate packaged installer
        run: |
          rm -rf /tmp/gg081 && mkdir -p /tmp/gg081
          tar -xzf packages/ghostguard/artifacts/ghostguard_0.8.1_kindle5-kindlepw2-kindlehf.kpkg -C /tmp/gg081
          grep -q 'PACKAGE_VERSION=0.8.1' /tmp/gg081/install.sh
          grep -q 'FILE_PATH_FORCE_REINDEX' /tmp/gg081/install.sh
          grep -q 'INPUT_GRAB=OFF' /tmp/gg081/install.sh
      - name: Materialize artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/v0.8.1-icon-fix' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ghostguard/artifacts/ghostguard_0.8.1_kindle5-kindlepw2-kindlehf.kpkg
          if ! git diff --cached --quiet; then
            git commit -m "[artifact-v081] materialize GhostGuard 0.8.1 KPM artifact"
            git push origin HEAD:v0.8.1-icon-fix
          fi
