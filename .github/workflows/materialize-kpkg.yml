name: Publish GhostGuard 0.6.8 Production RSA

on:
  push:
    paths:
      - '.github/workflows/materialize-kpkg.yml'
      - 'packages/ghostguard/source/**'
      - 'licenses/licenses.json'
      - 'licenses/licenses.sig'
  workflow_dispatch:

permissions:
  contents: write

# 0.6.8 production build: registry/signature are validated from the current main branch.
jobs:
  publish-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and signed registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re
          root=pathlib.Path('.')
          manifest=json.loads((root/'packages/ghostguard/source/manifest.json').read_text())
          assert manifest['manifest_version'] == 2
          assert manifest['version'] == [0,6,8]
          assert manifest['id'] == 'ghostguard'
          assert manifest['dependencies'] == []
          defaults=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/defaults.lua').read_text()
          assert 'version = "0.6.8-kindle-network-fallback"' in defaults
          assert 'raw.githubusercontent.com/dochoithuvi/ghostguard-kindle/main/licenses/licenses.json' in defaults
          assert 'cdn.jsdelivr.net/gh/dochoithuvi/ghostguard-kindle@main/licenses/licenses.json' in defaults
          online=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/online_license.lua').read_text()
          assert 'DCPRO-GhostGuard/0.6.8' in online
          assert 'GITHUB_RAW' in online and 'JSDELIVR' in online
          keyring=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/keyring.lua').read_text()
          assert 'ghostguard-prod-2026-08' in keyring
          prod_key=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/ghostguard-prod-2026-08.pem').read_text()
          assert 'BEGIN PUBLIC KEY' in prod_key
          crypto=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/license_crypto.lua').read_text()
          assert 'EVP_DigestUpdate' in crypto
          assert 'lib.EVP_DigestVerifyUpdate' not in crypto
          reg=json.loads((root/'licenses/licenses.json').read_text())
          sig=json.loads((root/'licenses/licenses.sig').read_text())
          assert reg['registry_format']==1
          assert reg['key_id']==sig['key_id']=='ghostguard-prod-2026-08'
          assert reg['sig_alg']==sig['sig_alg']=='RSA-SHA256'
          assert isinstance(reg.get('entries'), list) and reg['entries']
          for e in reg['entries']:
              assert 'serial' not in e and 'customer' not in e
              assert re.fullmatch(r'[0-9a-f]{64}', e['serial_hash'])
          raw=(root/'licenses/licenses.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==sig['content_sha256']
          pathlib.Path('/tmp/licenses.sig.bin').write_bytes(base64.b64decode(sig['sig'], validate=True))
          PY
          openssl dgst -sha256 \
            -verify packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/ghostguard-prod-2026-08.pem \
            -signature /tmp/licenses.sig.bin licenses/licenses.json
          ! grep -R --line-number --fixed-strings 'BEGIN PRIVATE KEY' packages/ghostguard/source licenses
          ! grep -R --line-number --fixed-strings 'BEGIN RSA PRIVATE KEY' packages/ghostguard/source licenses

      - name: Build KPM 0.2.2-compatible artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT='packages/ghostguard/artifacts/ghostguard_0.6.8_kindle5-kindlepw2-kindlehf.kpkg'
          mkdir -p packages/ghostguard/artifacts
          python3 - <<'PY'
          import pathlib, tarfile
          src = pathlib.Path('packages/ghostguard/source')
          out = pathlib.Path('packages/ghostguard/artifacts/ghostguard_0.6.8_kindle5-kindlepw2-kindlehf.kpkg')
          names = sorted(p.name for p in src.iterdir())
          names.remove('manifest.json')
          names.insert(0, 'manifest.json')
          with tarfile.open(out, 'w:gz', compresslevel=5) as tf:
              for name in names:
                  tf.add(src / name, arcname=name)
          PY
          tar -tzf "$ARTIFACT" > /tmp/ghostguard-kpkg-files.txt
          grep -qx 'manifest.json' /tmp/ghostguard-kpkg-files.txt
          ! grep -qx './manifest.json' /tmp/ghostguard-kpkg-files.txt
          ! grep -q 'main.lua.orig' /tmp/ghostguard-kpkg-files.txt
          tar -xOf "$ARTIFACT" manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["version"] == [0,6,8] and m["dependencies"] == []'
          SHA="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$ARTIFACT" > SHA256SUMS.txt
          echo "KPKG_SHA256=$SHA"

      - name: Promote KPM manifest to v0.6.8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('manifest.json')
          m=json.loads(p.read_text())
          a=m['packages']['ghostguard']['artifacts'][0]
          m['packages']['ghostguard']['description']='KOReader GhostGuard v0.6.8 - Production RSA key, GitHub Raw/jsDelivr license fallback, verified cache grace, Native/SimpleUI/ZenUI bridges and online activation.'
          a['url']='https://raw.githubusercontent.com/dochoithuvi/ghostguard-kindle/main/packages/ghostguard/artifacts/ghostguard_0.6.8_kindle5-kindlepw2-kindlehf.kpkg'
          a['version']=[0,6,8]
          a['dependencies']=[]
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          PY
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          a=m['packages']['ghostguard']['artifacts'][0]
          assert a['version']==[0,6,8]
          assert a['dependencies']==[]
          assert a['url'].endswith('ghostguard_0.6.8_kindle5-kindlepw2-kindlehf.kpkg')
          PY

      - name: Commit v0.6.8 source, artifact and KPM manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/source packages/ghostguard/artifacts/ghostguard_0.6.8_kindle5-kindlepw2-kindlehf.kpkg manifest.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'GhostGuard v0.6.8 is already public.'
          else
            git commit -m 'Promote GhostGuard 0.6.8 production RSA and network fallback'
            git push
          fi
