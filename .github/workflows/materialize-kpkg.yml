name: Publish GhostGuard 0.6.6 Production-Key RC

on:
  push:
    paths:
      - '.github/workflows/materialize-kpkg.yml'
      - 'packages/ghostguard/source/manifest.json'
      - 'packages/ghostguard/source/payload/dcghostguardpro.koplugin/_meta.lua'
      - 'packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/**'
      - 'licenses/licenses.json'
      - 'licenses/licenses.sig'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and signed registry
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ghostguard/source
          find . -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > checksums.sha256
          sha256sum --check checksums.sha256
          cd ../../..
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          manifest=json.loads((root/'packages/ghostguard/source/manifest.json').read_text())
          assert manifest['manifest_version'] == 2
          assert manifest['version'] == [0,6,6]
          assert manifest['dependencies'] == []
          main=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/main.lua').read_text()
          assert 'load_local("zenui_bridge.lua")' in main
          assert 'function DCPROGhostGuard:onZenUIReady()' in main
          assert 'text = _("Đồng bộ license online")' in main
          bridge=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/zenui_bridge.lua').read_text()
          assert '__ZEN_UI_REGISTER_HOME_ITEM' in bridge
          assert '__ZEN_UI_UNREGISTER_HOME_ITEM' in bridge
          keyring=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/keyring.lua').read_text()
          assert 'ghostguard-prod-2026-08' in keyring
          prod_key=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/ghostguard-prod-2026-08.pem').read_text()
          assert 'BEGIN PUBLIC KEY' in prod_key
          scriptlet=(root/'packages/ghostguard/source/scriptlets/DCPRO_GhostGuard.sh').read_text()
          assert '# Icon: /mnt/us/koreader/plugins/dcghostguardpro.koplugin/assets/ghostguard.svg' in scriptlet
          crypto=(root/'packages/ghostguard/source/payload/dcghostguardpro.koplugin/license_crypto.lua').read_text()
          assert 'EVP_DigestUpdate' in crypto
          assert 'lib.EVP_DigestVerifyUpdate' not in crypto
          reg=json.loads((root/'licenses/licenses.json').read_text())
          sig=json.loads((root/'licenses/licenses.sig').read_text())
          assert reg['registry_format']==1
          assert reg['key_id']==sig['key_id']=='ghostguard-rc-2026-08'
          assert reg['sig_alg']==sig['sig_alg']=='RSA-SHA256'
          assert isinstance(reg.get('entries'), list) and reg['entries']
          for e in reg['entries']:
              assert 'serial' not in e and 'customer' not in e
              assert re.fullmatch(r'[0-9a-f]{64}', e['serial_hash'])
          PY
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          raw=pathlib.Path('licenses/licenses.json').read_bytes()
          s=json.loads(pathlib.Path('licenses/licenses.sig').read_text())
          actual=hashlib.sha256(raw).hexdigest()
          assert actual==s['content_sha256'], (actual, s['content_sha256'])
          pathlib.Path('/tmp/licenses.sig.bin').write_bytes(base64.b64decode(s['sig'], validate=True))
          PY
          openssl dgst -sha256 \
            -verify packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/ghostguard-rc-2026-08.pem \
            -signature /tmp/licenses.sig.bin licenses/licenses.json
          ! grep -R --line-number --fixed-strings 'BEGIN PRIVATE KEY' packages/ghostguard/source licenses
          ! grep -R --line-number --fixed-strings 'BEGIN RSA PRIVATE KEY' packages/ghostguard/source licenses

      - name: Build KPM 0.2.2-compatible artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT='packages/ghostguard/artifacts/ghostguard_0.6.6_kindle5-kindlepw2-kindlehf.kpkg'
          mkdir -p packages/ghostguard/artifacts
          python3 - <<'PY'
          import pathlib, tarfile
          src = pathlib.Path('packages/ghostguard/source')
          out = pathlib.Path('packages/ghostguard/artifacts/ghostguard_0.6.6_kindle5-kindlepw2-kindlehf.kpkg')
          names = sorted(p.name for p in src.iterdir())
          names.remove('manifest.json')
          names.insert(0, 'manifest.json')
          with tarfile.open(out, 'w:gz', compresslevel=5) as tf:
              for name in names:
                  tf.add(src / name, arcname=name)
          PY
          tar -tzf "$ARTIFACT" > /tmp/ghostguard-kpkg-files.txt
          grep -qx 'manifest.json' /tmp/ghostguard-kpkg-files.txt
          ! grep -qx './manifest.json' /tmp/ghostguard-kpkg-files.txt
          ! grep -q 'main.lua.orig' /tmp/ghostguard-kpkg-files.txt
          tar -xOf "$ARTIFACT" manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["version"] == [0,6,6] and m["dependencies"] == []'
          SHA="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$ARTIFACT" > SHA256SUMS.txt
          echo "KPKG_SHA256=$SHA"

      - name: Promote KPM manifest to v0.6.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('manifest.json')
          m=json.loads(p.read_text())
          a=m['packages']['ghostguard']['artifacts'][0]
          m['packages']['ghostguard']['description']='KOReader GhostGuard v0.6.6 RC - Production RSA key support, Native/SimpleUI/ZenUI bridges, Library icon fix and RSA v4.1 online activation.'
          a['url']='https://raw.githubusercontent.com/dochoithuvi/ghostguard-kindle/main/packages/ghostguard/artifacts/ghostguard_0.6.6_kindle5-kindlepw2-kindlehf.kpkg'
          a['version']=[0,6,6]
          a['dependencies']=[]
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          PY
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          a=m['packages']['ghostguard']['artifacts'][0]
          assert a['version']==[0,6,6]
          assert a['dependencies']==[]
          assert a['url'].endswith('ghostguard_0.6.6_kindle5-kindlepw2-kindlehf.kpkg')
          PY

      - name: Commit v0.6.6 source, artifact and KPM manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/ghostguard/source \
            packages/ghostguard/artifacts/ghostguard_0.6.6_kindle5-kindlepw2-kindlehf.kpkg \
            manifest.json \
            SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'GhostGuard v0.6.6 is already public.'
          else
            git commit -m 'Promote GhostGuard 0.6.6 production RSA key support'
            git push
          fi
