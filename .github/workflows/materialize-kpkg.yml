name: Build GhostGuard 0.6.1 License Sync RC

on:
  push:
    paths:
      - '.bootstrap/v061_apply.patch'
      - '.github/workflows/materialize-kpkg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6.1 first-launch fix
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import json
          v=json.load(open('packages/ghostguard/source/manifest.json'))['version']
          print('.'.join(map(str,v)))
          PY
          )"
          if [ "$VERSION" = '0.6.0' ]; then
            patch --dry-run -p1 < .bootstrap/v061_apply.patch
            patch -p1 < .bootstrap/v061_apply.patch
          elif [ "$VERSION" = '0.6.1' ]; then
            echo 'Source already at v0.6.1; patch not reapplied.'
          else
            echo "Unexpected source version: $VERSION" >&2
            exit 1
          fi

      - name: Regenerate source checksums
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ghostguard/source
          find . -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > checksums.sha256
          sha256sum --check checksums.sha256

      - name: Validate source and signed registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          manifest=json.loads((root/'packages/ghostguard/source/manifest.json').read_text())
          assert manifest['version']==[0,6,1]
          reg=json.loads((root/'licenses/licenses.json').read_text())
          sig=json.loads((root/'licenses/licenses.sig').read_text())
          assert reg['registry_format']==1
          assert reg['key_id']==sig['key_id']=='ghostguard-rc-2026-08'
          assert reg['sig_alg']==sig['sig_alg']=='RSA-SHA256'
          assert isinstance(reg.get('entries'), list) and reg['entries']
          for e in reg['entries']:
              assert 'serial' not in e and 'customer' not in e
              assert re.fullmatch(r'[0-9a-f]{64}', e['serial_hash'])
          PY
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          raw=pathlib.Path('licenses/licenses.json').read_bytes()
          s=json.loads(pathlib.Path('licenses/licenses.sig').read_text())
          actual=hashlib.sha256(raw).hexdigest()
          assert actual==s['content_sha256'], (actual, s['content_sha256'])
          pathlib.Path('/tmp/licenses.sig.bin').write_bytes(base64.b64decode(s['sig'], validate=True))
          PY
          openssl dgst -sha256 \
            -verify packages/ghostguard/source/payload/dcghostguardpro.koplugin/keys/ghostguard-rc-2026-08.pem \
            -signature /tmp/licenses.sig.bin licenses/licenses.json
          ! grep -R --line-number --fixed-strings 'BEGIN PRIVATE KEY' packages/ghostguard/source licenses
          ! grep -R --line-number --fixed-strings 'BEGIN RSA PRIVATE KEY' packages/ghostguard/source licenses

      - name: Build KPM artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT='packages/ghostguard/artifacts/ghostguard_0.6.1_kindle5-kindlepw2-kindlehf.kpkg'
          mkdir -p packages/ghostguard/artifacts
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            -C packages/ghostguard/source -cf - . | gzip -n > "$ARTIFACT"
          tar -tzf "$ARTIFACT" > /tmp/ghostguard-kpkg-files.txt
          grep -Eq '^\./manifest\.json$|^manifest\.json$' /tmp/ghostguard-kpkg-files.txt
          tar -xOf "$ARTIFACT" ./manifest.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == [0,6,1]'
          SHA="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$ARTIFACT" > SHA256SUMS.txt
          echo "KPKG_SHA256=$SHA"

      - name: Commit v0.6.1 source and artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ghostguard/source packages/ghostguard/artifacts/ghostguard_0.6.1_kindle5-kindlepw2-kindlehf.kpkg SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'v0.6.1 source/artifact already current.'
          else
            git commit -m 'Materialize GhostGuard 0.6.1 License Sync RC'
            git push
          fi
