# Experimental: verify actual startup event on target firmware.
description "DCPRO IntentShield one-shot ZenOS launcher"
start on started framework
script
    i=0
    while [ "$i" -lt 90 ] && [ ! -f /mnt/us/GhostGuardIntentTrial/boot-launch.sh ]; do
        i=$((i+1)); sleep 1
    done
    [ -f /mnt/us/GhostGuardIntentTrial/boot-launch.sh ] || exit 0
    exec /bin/sh /mnt/us/GhostGuardIntentTrial/boot-launch.sh boot
end script
