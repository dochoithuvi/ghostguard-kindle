description "DCPRO GhostGuard v0.8 system supervisor"

# Userstore is mounted before the service reads its persistent config/state.
start on mounted_userstore
stop on stopping filesystems

# Fail-open crash protection: a bad service must never create an endless boot loop.
respawn
respawn limit 3 60
console none

script
    SERVICE="/mnt/us/.dcpro_ghostguard/service/ghostguard-service.sh"
    [ -x "$SERVICE" ] || exit 0
    exec /bin/sh "$SERVICE"
end script
